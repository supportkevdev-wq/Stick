<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Stick</title>
<meta name="description" content="Stick - a fast, boss-heavy arcade survival game. Wave, flick, and strike your way through waves of enemies and twelve original bosses.">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Stick">
<meta name="format-detection" content="telephone=no">
<style>
  html, body {
    margin: 0; padding: 0; background: #000;
    height: 100%;
    height: 100dvh;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    box-sizing: border-box;
  }
  #wrap {
    position: relative;
    width: 100%;
    max-width: 420px;
    aspect-ratio: 9 / 16;
    border: 4px solid #fff;
    box-sizing: border-box;
    background: #000;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #bossTintEl {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, rgba(120,0,10,0) 40%, rgba(90,0,10,0.6) 100%);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.6s ease;
  }
  #wrap.boss-mode #bossTintEl { opacity: 1; }
  canvas { display: block; width: 100%; height: 100%; }
  #score {
    position: absolute;
    top: 18px; left: 0; right: 0;
    text-align: center;
    color: #fff;
    font-size: 34px;
    font-weight: 600;
    letter-spacing: 1px;
    pointer-events: none;
  }
  #combo {
    position: absolute;
    top: 62px; left: 0; right: 0;
    text-align: center;
    color: #fff;
    font-size: 15px;
    letter-spacing: 3px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s linear;
  }
  #hint {
    position: absolute;
    bottom: 26px; left: 0; right: 0;
    text-align: center;
    color: #fff;
    font-size: 12px;
    opacity: 0.55;
    pointer-events: none;
  }
  #best {
    position: absolute;
    top: 46px; left: 16px;
    color: #fff;
    font-size: 10px;
    letter-spacing: 1px;
    opacity: 0.55;
    pointer-events: none;
  }
  #streak {
    position: absolute;
    top: 44px; right: 16px;
    color: #ffb347;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 0.5px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s linear;
  }
  #vignetteEl {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 45%, rgba(255,20,50,0.65) 100%);
    opacity: 0;
  }
  #reset {
    position: absolute;
    top: 16px; right: 16px;
    background: none;
    border: 1px solid #fff;
    color: #fff;
    font-size: 11px;
    padding: 5px 10px;
    letter-spacing: 1px;
    opacity: 0.6;
  }
  #mute {
    position: absolute;
    top: 16px; left: 16px;
    background: none;
    border: 1px solid #fff;
    color: #fff;
    font-size: 11px;
    padding: 5px 10px;
    letter-spacing: 1px;
    opacity: 0.6;
  }
  #pauseBtn {
    position: absolute;
    top: 66px; left: 16px;
    background: none;
    border: 1px solid #fff;
    color: #fff;
    font-size: 11px;
    padding: 5px 10px;
    letter-spacing: 1px;
    opacity: 0.6;
  }
  #audioBtn {
    position: absolute;
    top: 66px; right: 16px;
    width: 30px; height: 30px;
    border-radius: 50%;
    background: rgba(255,255,255,0.92);
    border: none;
    color: #111;
    font-size: 15px;
    line-height: 30px;
    text-align: center;
    padding: 0;
    box-shadow: 0 0 10px rgba(255,255,255,0.45);
  }
  #fullscreenBtn {
    position: absolute;
    top: 66px; right: 54px;
    width: 30px; height: 30px;
    border-radius: 50%;
    background: none;
    border: 1px solid #fff;
    color: #fff;
    font-size: 13px;
    line-height: 28px;
    text-align: center;
    padding: 0;
    opacity: 0.65;
  }
  #settingsEl .settingsRow {
    display: flex;
    justify-content: space-between;
    width: 100%;
  }
  #pauseOverlayEl {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.6);
    color: #fff;
    font-size: 26px;
    font-weight: 600;
    letter-spacing: 3px;
    text-align: center;
  }
  #pauseOverlayEl span {
    display: block;
    margin-top: 10px;
    font-size: 12px;
    font-weight: 400;
    letter-spacing: 1px;
    opacity: 0.7;
  }
  #healthBar {
    position: absolute;
    top: 106px; left: 24px; right: 24px; height: 8px;
    background: rgba(255,255,255,0.12);
    pointer-events: none;
  }
  #banterEl {
    position: absolute;
    top: 126px; left: 0; right: 0;
    text-align: center;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
    opacity: 0;
    transition: opacity 0.4s ease;
    pointer-events: none;
    text-shadow: 0 0 8px rgba(0,0,0,0.8);
  }
  #banterEl.stick { color: #fff; }
  #banterEl.mob { color: #ff3355; }
  #healthMid {
    position: absolute;
    left: 50%; top: -3px; bottom: -3px; width: 2px;
    background: #fff; opacity: 0.5;
  }
  #healthFill {
    position: absolute;
    top: 0; bottom: 0;
    background: #22e07a;
  }
  #healthFill.critical {
    animation: healthFlash 0.5s ease-in-out infinite;
  }
  @keyframes healthFlash {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
  #gameOverEl {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.55);
    color: #fff;
    font-size: 26px;
    font-weight: 600;
    letter-spacing: 3px;
    text-align: center;
    pointer-events: none;
  }
  #gameOverEl span {
    display: block;
    margin-top: 10px;
    font-size: 12px;
    font-weight: 400;
    letter-spacing: 1px;
    opacity: 0.7;
  }
  #levelTransitionEl {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(180deg, rgba(130,0,10,0.93), rgba(55,0,5,0.97));
    color: #fff;
    text-align: center;
  }
  #levelTransitionEl .lvlSub {
    font-size: 12px;
    letter-spacing: 4px;
    opacity: 0.8;
    text-transform: uppercase;
  }
  #levelTransitionEl .lvlLine {
    width: 70px; height: 2px;
    background: #fff; opacity: 0.6;
    margin: 14px 0;
  }
  #levelTransitionEl .lvlTitle {
    font-size: 46px;
    font-weight: 800;
    letter-spacing: 6px;
    text-shadow: 0 0 10px #fff, 0 0 30px #ff3355, 0 0 60px #ff3355;
    animation: levelPop 0.6s cubic-bezier(.2,1.6,.4,1);
  }
  #levelTransitionEl .lvlJelly {
    margin-top: 18px;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.4px;
    min-height: 20px;
    max-width: 280px;
    text-align: center;
    transition: opacity 0.18s ease;
  }
  #levelTransitionEl .lvlJelly.stick { color: #fff; }
  #levelTransitionEl .lvlJelly.mob { color: #ffd166; }
  @keyframes levelPop {
    0% { transform: scale(0.4); opacity: 0; }
    55% { transform: scale(1.12); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }
  #introEl {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(1.5px 1.5px at 20px 30px, rgba(255,255,255,0.7), transparent),
      radial-gradient(1px 1px at 90px 80px, rgba(255,255,255,0.45), transparent),
      radial-gradient(1.5px 1.5px at 160px 40px, rgba(255,255,255,0.55), transparent),
      radial-gradient(1px 1px at 40px 130px, rgba(255,255,255,0.35), transparent),
      radial-gradient(1.5px 1.5px at 220px 100px, rgba(255,255,255,0.55), transparent),
      radial-gradient(1px 1px at 280px 60px, rgba(255,255,255,0.4), transparent),
      radial-gradient(ellipse at 50% 30%, #041018 0%, #000000 65%),
      #000;
    background-repeat: repeat, repeat, repeat, repeat, repeat, repeat, no-repeat, no-repeat;
    background-size: 300px 300px, 300px 300px, 300px 300px, 300px 300px, 300px 300px, 300px 300px, 100% 100%, 100% 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    box-sizing: border-box;
    padding: 30px 24px;
  }
  #introEl .introTitle {
    color: #fff;
    font-size: 13px;
    letter-spacing: 4px;    text-transform: uppercase;
    opacity: 0.75;
    text-shadow: 0 0 10px rgba(255,255,255,0.5);
  }
  #settingsEl {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    background: rgba(0,0,0,0.94);
  }
  #settingsEl .settingsTitle {
    color: #fff;
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
    opacity: 0.7;
    margin-bottom: 28px;
  }
  #settingsEl label {
    color: #fff;
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    opacity: 0.85;
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 220px;
    margin-bottom: 24px;
  }
  #settingsEl input[type=range] {
    width: 100%;
    touch-action: manipulation;
    accent-color: #ff3355;
  }
  #settingsClose {
    margin-top: 8px;
    background: none;
    border: 1px solid #fff;
    color: #fff;
    font-size: 12px;
    letter-spacing: 1px;
    padding: 9px 26px;
  }
  #introEl .introScene {
    width: 100%;
    flex: 1;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    padding: 0 20px 26px;
    box-sizing: border-box;
  }
  #powerCutsceneEl .introScene {
    width: 100%;
    flex: 1;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    padding: 0 22px 50px;
    box-sizing: border-box;
  }
  #introEl .introStick {
    width: 6px;
    height: 68px;
    background: #fff;
    border-radius: 3px;
    position: relative;
    transform-origin: bottom center;
    animation: stickIdle 0.6s ease-in-out infinite;
  }
  @keyframes stickIdle {
    0%, 100% { transform: translateY(0) rotate(-15deg); }
    50% { transform: translateY(-10px) rotate(15deg); }
  }
  #introEl .introStick.emphasis {
    animation: stickEmphasis 0.55s ease-out;
  }
  @keyframes stickEmphasis {
    0%   { transform: translate(0,0) rotate(-15deg) scale(1); }
    28%  { transform: translate(16px,-20px) rotate(24deg) scale(1.22); }
    58%  { transform: translate(20px,4px) rotate(-14deg) scale(0.88); }
    100% { transform: translate(0,0) rotate(-15deg) scale(1); }
  }
  #introEl .introStick::after {
    content: '';
    position: absolute;
    top: -6px; left: -3px;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: #fff;
  }
  #introEl .introMobs {
    display: flex;
    align-items: flex-end;
    gap: 8px;
  }
  #introEl .introMobs span {
    display: block;
    width: 15px; height: 15px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ff8a9c 0%, #ff3355 55%, #8c0018 100%);
    box-shadow: 0 0 8px #ff3355, 0 0 16px rgba(255,51,85,0.5);
    animation: mobBounce 0.45s ease-in-out infinite;
  }
  @keyframes mobBounce {
    0%, 100% { transform: translateY(0) rotate(-8deg); }
    50% { transform: translateY(-11px) rotate(8deg); }
  }
  #introEl .introMobs span:nth-child(1) { animation-delay: 0s; }
  #introEl .introMobs span:nth-child(2) { animation-delay: 0.12s; }
  #introEl .introMobs span:nth-child(3) { animation-delay: 0.24s; }
  #introEl .introMobs span:nth-child(2) { width: 20px; height: 20px; }
  #introEl .introMobs.emphasis span {
    animation: mobEmphasis 0.55s ease-out;
  }
  @keyframes mobEmphasis {
    0%   { transform: translate(0,-7px) scale(1); filter: none; }
    30%  { transform: translate(-14px,-22px) scale(1.45); filter: brightness(2); }
    62%  { transform: translate(-8px,5px) scale(0.82); filter: none; }
    100% { transform: translate(0,-7px) scale(1); filter: none; }
  }
  #introEl .introMobs.emphasis span:nth-child(1) { animation-delay: 0s; }
  #introEl .introMobs.emphasis span:nth-child(2) { animation-delay: 0.04s; }
  #introEl .introMobs.emphasis span:nth-child(3) { animation-delay: 0.08s; }

  #introEl .introStick.finisher {
    transform-origin: 50% 50%;
    animation: stickFinisher 1.05s cubic-bezier(.3,.6,.3,1) forwards;
  }
  @keyframes stickFinisher {
    0%   { transform: translate(0,0) rotate(-15deg) scaleY(1); }
    8%   { transform: translate(-8px,10px) rotate(-32deg) scaleY(0.5); }   /* wind-up: coil back */
    28%  { transform: translate(calc(var(--finishDX)*0.22), calc(var(--finishDY)*0.3 - 72px)) rotate(180deg) scaleY(1.3); } /* explosive leap */
    42%  { transform: translate(calc(var(--finishDX)*0.4), calc(var(--finishDY)*0.32 - 82px)) rotate(240deg) scaleY(1.15); }
    54%  { transform: translate(calc(var(--finishDX)*0.46), calc(var(--finishDY)*0.32 - 82px)) rotate(270deg) scaleY(1.15); } /* hang at the peak */
    80%  { transform: translate(calc(var(--finishDX)*0.9), calc(var(--finishDY)*0.92)) rotate(600deg) scaleY(0.85); } /* fast tomahawk dive */
    91%  { transform: translate(var(--finishDX), var(--finishDY)) rotate(740deg) scaleY(0.48); } /* impact squash */
    100% { transform: translate(var(--finishDX), var(--finishDY)) rotate(740deg) scaleY(0.48); }
  }
  #introEl.shake { animation: introShake 0.3s ease-in-out; }
  @keyframes introShake {
    0%, 100% { transform: translate(0,0); }
    20% { transform: translate(-7px,3px); }
    40% { transform: translate(6px,-4px); }
    60% { transform: translate(-5px,3px); }
    80% { transform: translate(4px,-2px); }
  }
  #introFlash {
    position: absolute;
    inset: 0;
    background: #fff;
    opacity: 0;
    pointer-events: none;
  }
  #introFlash.flash { animation: introFlashPulse 0.28s ease-out; }
  @keyframes introFlashPulse {
    0% { opacity: 0.85; }
    100% { opacity: 0; }
  }
  #introEl .introMobs.smashed span:nth-child(1) {
    animation: mobSmashed 0.4s ease-in forwards;
    animation-delay: 0.94s;
    --scatterX: -26px;
  }
  #introEl .introMobs.smashed span:nth-child(2) {
    animation: mobSmashed 0.4s ease-in forwards;
    animation-delay: 0.98s;
    --scatterX: 6px;
  }
  #introEl .introMobs.smashed span:nth-child(3) {
    animation: mobSmashed 0.4s ease-in forwards;
    animation-delay: 1.02s;
    --scatterX: 34px;
  }
  @keyframes mobSmashed {
    0% { transform: translateY(-7px) scale(1) rotate(0deg); opacity: 1; filter: none; }
    30% { transform: translateY(-7px) scale(1.4) rotate(0deg); opacity: 1; filter: brightness(2.4); }
    100% { transform: translate(var(--scatterX), 36px) scale(0) rotate(200deg); opacity: 0; }
  }
  #introBubble {
    width: 100%;
    min-height: 46px;
    box-sizing: border-box;
    padding: 0 8px;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.3px;
    line-height: 1.35;
    transition: opacity 0.18s ease;
  }
  #introBubble.stick {
    color: #fff; text-align: left;
    text-shadow: 0 0 12px rgba(255,255,255,0.55), 0 0 26px rgba(180,220,255,0.3);
  }
  #introBubble.mob {
    color: #ff3355; text-align: right;
    text-shadow: 0 0 12px rgba(255,51,85,0.6), 0 0 26px rgba(255,51,85,0.35);
  }
  #introBubble.lineIn.stick { animation: lineInLeft 0.42s cubic-bezier(.2,.9,.3,1); }
  #introBubble.lineIn.mob { animation: lineInRight 0.42s cubic-bezier(.2,.9,.3,1); }
  @keyframes lineInLeft {
    0%   { opacity: 0; transform: translateX(-26px) scale(0.94); filter: blur(5px); }
    60%  { opacity: 1; filter: blur(0); }
    100% { opacity: 1; transform: translateX(0) scale(1); filter: blur(0); }
  }
  @keyframes lineInRight {
    0%   { opacity: 0; transform: translateX(26px) scale(0.94); filter: blur(5px); }
    60%  { opacity: 1; filter: blur(0); }
    100% { opacity: 1; transform: translateX(0) scale(1); filter: blur(0); }
  }
  /* cinematic letterbox - slides in on load, retracts as the scene ends */
  .cineBar {
    position: absolute;
    left: 0; right: 0;
    height: 42px;
    background: #000;
    z-index: 6;
    pointer-events: none;
    transition: transform 0.7s cubic-bezier(.4,0,.2,1);
  }
  .cineBar.top { top: 0; transform: translateY(-100%); }
  .cineBar.bottom { bottom: 0; transform: translateY(100%); }
  #introEl.cineIn .cineBar.top { transform: translateY(0); }
  #introEl.cineIn .cineBar.bottom { transform: translateY(0); }
  /* volumetric light rays drifting behind the scene */
  #introRays {
    position: absolute;
    inset: -20%;
    pointer-events: none;
    background:
      linear-gradient(103deg, transparent 42%, rgba(120,190,255,0.07) 47%, transparent 52%),
      linear-gradient(97deg,  transparent 58%, rgba(180,140,255,0.06) 63%, transparent 68%),
      linear-gradient(110deg, transparent 22%, rgba(255,255,255,0.045) 26%, transparent 31%);
    animation: rayDrift 14s ease-in-out infinite alternate;
  }
  @keyframes rayDrift {
    0%   { transform: translateX(-4%) rotate(-1deg); opacity: 0.75; }
    100% { transform: translateX(4%) rotate(1deg); opacity: 1; }
  }
  /* grain + vignette so the intro matches the in-game post-processing */
  #introGrain {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 5;
    opacity: 0.05;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/></filter><rect width='120' height='120' filter='url(%23n)' opacity='0.55'/></svg>");
    animation: grainShift 0.5s steps(3) infinite;
  }
  @keyframes grainShift {
    0%   { transform: translate(0,0); }
    33%  { transform: translate(-4px,3px); }
    66%  { transform: translate(3px,-4px); }
    100% { transform: translate(0,0); }
  }
  #introVignette {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 4;
    background: radial-gradient(ellipse at 50% 45%, transparent 38%, rgba(0,0,0,0.55) 100%);
  }
  /* slow continuous push-in on the staged scene for cinematic motion */
  #introEl .introScene {
    animation: cinePush 13s ease-in-out infinite alternate;
  }
  @keyframes cinePush {
    0%   { transform: scale(1) translateY(0); }
    100% { transform: scale(1.07) translateY(-5px); }
  }
  #introPrompt {
    color: #fff;
    opacity: 0.5;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    height: 14px;
    display: none;
  }
  #difficultyPicker {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 10px;
  }
  #difficultyPicker .diffBtn {
    background: none;
    border: 1px solid rgba(255,255,255,0.4);
    color: rgba(255,255,255,0.6);
    font-size: 10px;
    letter-spacing: 1px;
    padding: 7px 11px;
    border-radius: 4px;
    font-family: inherit;
  }
  #difficultyPicker .diffBtn.selected {
    background: #fff;
    color: #000;
    border-color: #fff;
  }
  #powerCutsceneEl {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(1.5px 1.5px at 30px 40px, rgba(255,255,255,0.6), transparent),
      radial-gradient(1px 1px at 100px 90px, rgba(255,255,255,0.4), transparent),
      radial-gradient(1.5px 1.5px at 170px 30px, rgba(255,255,255,0.5), transparent),
      radial-gradient(1px 1px at 50px 140px, rgba(255,255,255,0.3), transparent),
      radial-gradient(1.5px 1.5px at 230px 110px, rgba(255,255,255,0.5), transparent),
      radial-gradient(ellipse at 68% 24%, #2a0008 0%, #000000 62%),
      #000;
    background-repeat: repeat, repeat, repeat, repeat, repeat, no-repeat, no-repeat;
    background-size: 300px 300px, 300px 300px, 300px 300px, 300px 300px, 300px 300px, 100% 100%, 100% 100%;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    box-sizing: border-box;
    padding: 30px 24px;
  }
  #powerCutsceneEl .introTitle {
    color: #ffd166;
    font-size: 13px;
    letter-spacing: 4px;
    text-transform: uppercase;
    opacity: 0.85;
    text-shadow: 0 0 12px rgba(255,209,102,0.6);
  }
  #powerCutsceneEl .introStick {
    width: 6px;
    height: 68px;
    background: linear-gradient(#ffffff, #ffe9c2);
    border-radius: 3px;

<script>
(function(){
  const wrap = document.getElementById('wrap');
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const streakEl = document.getElementById('streak');
  const comboEl = document.getElementById('combo');
  const vignetteEl = document.getElementById('vignetteEl');
  const hintEl = document.getElementById('hint');
  const banterEl = document.getElementById('banterEl');
  const resetBtn = document.getElementById('reset');
  const muteBtn = document.getElementById('mute');
  const healthFillEl = document.getElementById('healthFill');
  const gameOverEl = document.getElementById('gameOverEl');
  const levelTransitionEl = document.getElementById('levelTransitionEl');
  const levelTransitionTitle = document.getElementById('levelTransitionTitle');
  const levelTransitionJelly = document.getElementById('levelTransitionJelly');
  const levelPromptEl = document.getElementById('levelPrompt');
  const introEl = document.getElementById('introEl');
  const introBubbleEl = document.getElementById('introBubble');
  const introPromptEl = document.getElementById('introPrompt');
  const difficultyPickerEl = document.getElementById('difficultyPicker');
  const audioBtn = document.getElementById('audioBtn');
  const settingsEl = document.getElementById('settingsEl');
  const sfxSlider = document.getElementById('sfxSlider');
  const musicSlider = document.getElementById('musicSlider');
  const sfxReadout = document.getElementById('sfxReadout');
  const musicReadout = document.getElementById('musicReadout');
  const settingsCloseBtn = document.getElementById('settingsClose');
  const pauseBtn = document.getElementById('pauseBtn');
  const pauseOverlayEl = document.getElementById('pauseOverlayEl');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  const introFlashEl = document.getElementById('introFlash');
  const powerCutsceneEl = document.getElementById('powerCutsceneEl');
  const powerTitleEl = document.getElementById('powerTitle');
  const powerBubbleEl = document.getElementById('powerBubble');
  const powerPromptEl = document.getElementById('powerPrompt');
  const powerFireballEl = document.getElementById('powerFireball');
  const powerOrbDemoEl = document.getElementById('powerOrbDemo');
  const powerMonsterEl = document.getElementById('powerMonster');
  const powerFlashEl = document.getElementById('powerFlash');
  const powerEpilogueEl = document.getElementById('powerEpilogue');

  let soundOn = true;
  let sfxVolume = 0.1, musicVolume = 0.9; // sfx quiet, music the dominant layer, by default
  let audioCtx = null;
  let masterBus = null, masterLowpass = null;
  function buildReverbImpulse(ctx, duration, decay){
    const rate = ctx.sampleRate;
    const length = Math.max(1, Math.floor(rate*duration));
    const impulse = ctx.createBuffer(2, length, rate);
    for(let ch=0; ch<2; ch++){
      const data = impulse.getChannelData(ch);
      for(let i=0;i<length;i++){
        data[i] = (Math.random()*2-1) * Math.pow(1 - i/length, decay);
      }
    }
    return impulse;
  }
  function setupMasterBus(){
    // Stage 1: a musical compressor that glues the mix together without
    // being heavy-handed on any single sound.
    const compressor = audioCtx.createDynamicsCompressor();
    compressor.threshold.value = -24;
    compressor.knee.value = 12;
    compressor.ratio.value = 5;
    compressor.attack.value = 0.003;
    compressor.release.value = 0.22;

    // master lowpass - swept dynamically to muffle everything when health is
    // critical, which reads as tension without new sounds
    const masterFilter = audioCtx.createBiquadFilter();
    masterFilter.type = 'lowpass';
    masterFilter.frequency.value = 20000;
    masterFilter.Q.value = 0.7;

    // Stage 2: a true brickwall limiter as the very last thing before the
    // speakers, to stop simultaneous voices from clipping at the hardware
    // output regardless of how loud the mix gets upstream.
    const limiter = audioCtx.createDynamicsCompressor();
    limiter.threshold.value = -9;
    limiter.knee.value = 0;
    limiter.ratio.value = 20;
    limiter.attack.value = 0.001;
    limiter.release.value = 0.08;

    compressor.connect(masterFilter);
    masterFilter.connect(limiter);
    limiter.connect(audioCtx.destination);

    // reverb: shortish tail, highpassed going in and lowpassed coming back
    // so it adds space without turning to mud
    const reverb = audioCtx.createConvolver();
    reverb.buffer = buildReverbImpulse(audioCtx, 1.1, 3.4);
    const reverbHP = audioCtx.createBiquadFilter();
    reverbHP.type = 'highpass'; reverbHP.frequency.value = 500; reverbHP.Q.value = 0.7;
    const reverbLP = audioCtx.createBiquadFilter();
    reverbLP.type = 'lowpass'; reverbLP.frequency.value = 7000;
    reverbHP.connect(reverb);
    const reverbGain = audioCtx.createGain();
    reverbGain.gain.value = 0.1;
    reverb.connect(reverbLP);
    reverbLP.connect(reverbGain);
    reverbGain.connect(compressor);

    // ping-pong stereo delay: left and right taps feed back into each
    // other, damped each pass so repeats thin out instead of stacking
    const delayL = audioCtx.createDelay(1.5);
    const delayR = audioCtx.createDelay(1.5);
    delayL.delayTime.value = 0.26;
    delayR.delayTime.value = 0.39;
    const fbL = audioCtx.createGain(); fbL.gain.value = 0.24;
    const fbR = audioCtx.createGain(); fbR.gain.value = 0.24;
    const fbDampL = audioCtx.createBiquadFilter(); fbDampL.type='highpass'; fbDampL.frequency.value=400;
    const fbDampR = audioCtx.createBiquadFilter(); fbDampR.type='highpass'; fbDampR.frequency.value=400;
    const fbLoL = audioCtx.createBiquadFilter(); fbLoL.type='lowpass'; fbLoL.frequency.value=5000;
    const fbLoR = audioCtx.createBiquadFilter(); fbLoR.type='lowpass'; fbLoR.frequency.value=5000;
    const panL = audioCtx.createStereoPanner(); panL.pan.value=-0.7;
    const panR = audioCtx.createStereoPanner(); panR.pan.value=0.7;
    delayL.connect(fbL); fbL.connect(fbDampL); fbDampL.connect(fbLoL); fbLoL.connect(delayR);
    delayR.connect(fbR); fbR.connect(fbDampR); fbDampR.connect(fbLoR); fbLoR.connect(delayL);
    delayL.connect(panL); panL.connect(compressor);
    delayR.connect(panR); panR.connect(compressor);
    const delayHP = audioCtx.createBiquadFilter(); delayHP.type='highpass'; delayHP.frequency.value=450;
    const delaySend = audioCtx.createGain(); delaySend.gain.value = 0.085;
    delaySend.connect(delayHP); delayHP.connect(delayL); delayHP.connect(delayR);

    // one bus for every voice - bass, mid, and lead alike, all get the same
    // full treatment now. No separate dry/lead path this time.
    const dry = audioCtx.createGain();
    dry.gain.value = 1;
    dry.connect(compressor);
    dry.connect(reverbHP);
    dry.connect(delaySend);

    masterBus = dry;
    masterLowpass = masterFilter;
  }
  function ensureAudio(){
    if(!audioCtx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(AC) audioCtx = new AC();
      if(audioCtx) setupMasterBus();
    }
    if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }
  function beep(freq, duration, type, volume, freqEnd){
    if(!soundOn || sfxVolume <= 0) return;
    ensureAudio();
    if(!audioCtx) return;
    const t0 = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    if(freqEnd) osc.frequency.exponentialRampToValueAtTime(Math.max(1,freqEnd), t0+duration);
    // a short attack ramp before the sustain/decay - starting straight at
    // full volume creates a hard step right where the waveform begins
    // (sawtooth/square in particular don't start at a zero-crossing), and
    // that step is an audible click. With every stick swing and enemy hit
    // routed through this function, that's what was reading as crackle.
    const v = Math.max(0.0001, (volume||0.12) * sfxVolume);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(v, t0+0.004);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0+duration);
    osc.connect(gain); gain.connect(masterBus || audioCtx.destination);
    osc.start(t0); osc.stop(t0+duration);
  }

  // Background music: fully original note patterns (not derived from any
  // existing song) scheduled via the audio clock. One continuous theme with
  // four sections that plays throughout, including boss fights.
  let musicPlaying = false, musicNextTimer = null;
  // a warmer, more "real instrument" tone: a fundamental plus three quiet
  // harmonics (additive synthesis), with a soft pluck attack and a long
  // natural decay so notes ring and overlap instead of sounding like blips
  function playInstrumentNote(freq, when, dur, vol, pan){
    if(!soundOn || !audioCtx || musicVolume <= 0) return;
    // Pitch-dependent shaping. On a real instrument short strings/bars damp
    // faster and carry less harmonic energy than long ones, and our ears hear
    // highs as louder. Applying all three keeps the top of the scale run clean
    // instead of letting long, bright, equal-volume notes stack into mush.
    const pitch = Math.max(0, Math.min(1, (freq - 200) / 500)); // 0 at 200Hz, 1 at 700Hz+
    const durMult = 1 - pitch*0.6;   // top notes ring ~40% as long
    const gainMult = 1 - pitch*0.42;  // and sit noticeably quieter
    dur = dur * durMult;
    const v = vol * gainMult * musicVolume;
    if(v <= 0.0001) return;

    const master = audioCtx.createGain();
    master.gain.setValueAtTime(0.0001, when);
    master.gain.exponentialRampToValueAtTime(v, when+0.015);

      bass: [110,0,0,0, 0,0,130.81,0, 0,0,0,0],

  function scheduleMusicLoop(){
    if(!musicPlaying){ return; }
    if(!soundOn || !audioCtx){ musicNextTimer = setTimeout(scheduleMusicLoop, 300); return; }
    const stepDur = 0.26;
    const startAt = audioCtx.currentTime + 0.05;
    let loopMs;
    {
      let t = startAt;
      for(let s=0;s<NORMAL_SECTIONS.length;s++){
        const sec = NORMAL_SECTIONS[s];
        const len = sec.lead.length;
        for(let i=0;i<len;i++){
          const stepT = t + i*stepDur;
          if(sec.bass[i] > 0) playInstrumentNote(sec.bass[i], stepT, stepDur*sec.dur.bass, sec.vol.bass, -0.3);
          if(sec.mid[i] > 0)  playInstrumentNote(sec.mid[i],  stepT, stepDur*sec.dur.mid,  sec.vol.mid, -0.35);
          if(sec.lead[i] > 0) playInstrumentNote(sec.lead[i], stepT, stepDur*sec.dur.lead, sec.vol.lead, 0.3);
        }
        t += len*stepDur;
      }
      loopMs = (t - startAt) * 1000;
    }
    musicNextTimer = setTimeout(scheduleMusicLoop, loopMs);

  function norm(a){ while(a>Math.PI) a-=2*Math.PI; while(a<-Math.PI) a+=2*Math.PI; return a; }
  function rand(a,b){ return a + Math.random()*(b-a); }
  // survival-affecting difficulty (drain, spawn rate, fire rate) plateaus at
  // level 10 so the longer level-10+ boss gauntlets stay survivable; boss HP
  // keeps climbing past that so fights still get tougher, just not deadlier
  function scalingLevel(){ return Math.min(level, 10); }
  // offsets the longer level-10+ gauntlets from the other direction: a real
  // damage boost against bosses, not just easier survival
  function bossDamageMult(){ return level >= 10 ? 1.5 : 1; }
  function diffMult(){ return 1 + (scalingLevel()-1)*0.08; }
  function shadeColor(hex, percent){
    const num = parseInt(hex.slice(1), 16);
    let r = (num>>16)&0xff, g = (num>>8)&0xff, b = num&0xff;
    const t = percent > 0 ? 255 : 0;
    const p = Math.abs(percent)/100;
    r = Math.round(r + (t-r)*p); g = Math.round(g + (t-g)*p); b = Math.round(b + (t-b)*p);
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }
  function hexToRgba(hex, alpha){
    const num = parseInt(hex.slice(1), 16);
    const r = (num>>16)&0xff, g = (num>>8)&0xff, b = num&0xff;
    return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha.toFixed(2) + ')';
  }
  function initStars(){
    stars.length = 0;
    for(let i=0;i<STAR_COUNT;i++){
      const roll = Math.random();
      const colorType = roll < 0.75 ? 0 : (roll < 0.9 ? 1 : 2); // mostly white, some warm, some cool
      stars.push({x:rand(-1,1), y:rand(-1,1), z:rand(0.15,1), seed:rand(0,100), colorType});
    }
  }
  initStars();

  const shootingStars = [];
  let shootingStarTimer = rand(6000,14000);
  function spawnShootingStar(){
    const fromLeft = Math.random() < 0.5;
    const y0 = rand(H*0.05, H*0.35);
    shootingStars.push({
      x: fromLeft ? -20 : W+20, y: y0,
      vx: (fromLeft?1:-1)*rand(0.5,0.8), vy: rand(0.15,0.3),
      born: performance.now(), life: 700
    });
  }

  const NEBULAE = [
    {x:0.2, y:0.28, r:0.5,  color:'#4a1a6a', driftSpeed:1.0, phase:0},
    {x:0.75,y:0.6,  r:0.42, color:'#1a3a6a', driftSpeed:0.8, phase:2.1},
    {x:0.5, y:0.15, r:0.32, color:'#6a1a3a', driftSpeed:1.3, phase:4.2}
  ];
  function drawNebulae(now){
    for(let i=0;i<NEBULAE.length;i++){
      const n = NEBULAE[i];
      const nx = (n.x + Math.sin(now*0.00004*n.driftSpeed+n.phase)*0.06) * W;
      const ny = (n.y + Math.cos(now*0.00003*n.driftSpeed+n.phase)*0.06) * H;
      const r = n.r * Math.max(W,H);
      const grad = ctx.createRadialGradient(nx,ny,0, nx,ny,r);
      grad.addColorStop(0, hexToRgba(n.color, 0.1));
      grad.addColorStop(1, hexToRgba(n.color, 0));
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(nx,ny,r,0,Math.PI*2);
      ctx.fill();
    }
  }

  function spawnPlanet(){
    const def = PLANET_TYPES[Math.floor(rand(0,PLANET_TYPES.length))];
    const r = rand(70,150);
    const fromLeft = Math.random() < 0.5;
    const y = rand(H*0.12, H*0.55);
    const x = fromLeft ? -r*1.3 : W+r*1.3;
    const vx = (fromLeft ? 1 : -1) * rand(0.004, 0.009);
    const vy = rand(-0.0012, 0.0012);
    const rotSpeed = rand(-0.00006, 0.00006) || 0.00003;
    planets.push({x, y, r, vx, vy, def, rot: rand(0,Math.PI*2), rotSpeed, seed: rand(0,100)});
  }

  const BOSS_SHAPES = [];
  function initBossShapes(){
    BOSS_SHAPES.length = 0;
    for(let i=0;i<50;i++){
      const isStar = i%2===1;
      const sides = 3 + (i%8); // 3..10
      const rot = (i*0.37) % (Math.PI*2);
      const innerRatio = 0.42 + ((i*7)%5)*0.07;
      BOSS_SHAPES.push({kind: isStar?'star':'polygon', sides, rot, innerRatio});
    }
  }
  initBossShapes();

  function showCombo(label){
    comboEl.textContent = label;
    comboEl.style.opacity = '1';
    hintEl.style.opacity = '0';
    if(comboTimeout) clearTimeout(comboTimeout);
    comboTimeout = setTimeout(()=>{ comboEl.style.opacity = '0'; }, 700);
    playSoundForLabel(label);
  }

  const HIT_LABELS = ['HIT','CHAIN','BOSS HIT','BOSS DOWN','JELLY'];

  function addScore(n, label){
    score += n;
    scoreEl.textContent = String(score);
    showCombo(label);

    if(score > bestScore){
      bestScore = score;
      bestEl.textContent = 'BEST ' + bestScore;
    }
    if(!bestBeatenAnnounced && runStartBest > 0 && score > runStartBest){
      bestBeatenAnnounced = true;
      showCombo('NEW BEST!');
    }

    if(HIT_LABELS.indexOf(label) !== -1){
      streak++;
      streakTimer = STREAK_HOLD_MS;
      if(streak >= 2){
        streakEl.textContent = 'x' + streak;
        streakEl.style.opacity = '1';
      }
    }
  }

  function triggerShake(mag){
    shakeMag = Math.max(shakeMag, mag);
  }

  function addHealth(n){
    const tier = diffTier();
    const scaled = n >= 0 ? n*tier.healMult : n*tier.dmgMult;
    health = Math.max(HEALTH_MIN, Math.min(HEALTH_MAX, health+scaled));
  }

  function updateHealthUI(){
    const pct = (health - HEALTH_MIN) / (HEALTH_MAX - HEALTH_MIN);
    if(health >= 0){
      healthFillEl.style.left = '50%';
      healthFillEl.style.width = Math.max(0,(pct-0.5)*100) + '%';
      healthFillEl.style.background = '#22e07a';
    } else {
      healthFillEl.style.width = Math.max(0,(0.5-pct)*100) + '%';
      healthFillEl.style.left = (pct*100) + '%';
      healthFillEl.style.background = '#ff3355';
    }
    healthFillEl.classList.toggle('critical', health <= VIGNETTE_START);
    if(health <= VIGNETTE_START){
      const intensity = Math.min(1, (VIGNETTE_START-health) / (VIGNETTE_START-HEALTH_MIN));
      const pulse = 0.6 + 0.4*Math.sin(performance.now()*0.006);
      vignetteEl.style.opacity = String(intensity*pulse);
    } else {
      vignetteEl.style.opacity = '0';
    }
  }

  function triggerGameOver(){
    gameOver = true;
    gameOverEl.style.display = 'flex';
    triggerShake(12);
    sfx.gameOver();
  }

  function angleTo(px,py){ return Math.atan2(py-pivotY, px-pivotX); }

  function pointerPos(e){
    const r = wrap.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }

  function spawnEnemy(){
    const edge = Math.floor(rand(0,4));
    let ex, ey;
    if(edge===0){ ex=rand(MARGIN,W-MARGIN); ey=MARGIN; }
    else if(edge===1){ ex=W-MARGIN; ey=rand(MARGIN,H-MARGIN); }
    else if(edge===2){ ex=rand(MARGIN,W-MARGIN); ey=H-MARGIN; }
    else { ex=MARGIN; ey=rand(MARGIN,H-MARGIN); }
    const ang = rand(0, Math.PI*2), spd = rand(0.02,0.05) * (1 + (scalingLevel()-1)*0.07);
    enemies.push({x:ex, y:ey, vx:Math.cos(ang)*spd, vy:Math.sin(ang)*spd, r:ENEMY_R});
  }

  // small, rare variants of the regular mob - a bit more resistant or a
  // bit trickier to land a hit on, but never a full damage sponge. Keeps
  // the pop-the-dot loop's rhythm while adding texture between boss fights.
  // Toughness scales gently with level: 2 hits at level 1, up to the full
  // 4-hits-to-crack-plus-1-to-destroy by level 10, then holds steady.
  const MINI_BOSS_TYPES = [
    {type:'boilback', color:'#7d8a5e', label:'BOILBACK'},
    {type:'broodsac', color:'#8fae6a', label:'BROOD SAC'},
    {type:'twitcher', color:'#6b5d4f', label:'TWITCHER'}
  ];
  function miniBossMaxHp(){
    const sl = scalingLevel();
    return Math.round(2 + (sl-1)*(3/9));
  }
  function spawnMiniBoss(){
    const def = MINI_BOSS_TYPES[Math.floor(rand(0,MINI_BOSS_TYPES.length))];
    const edge = Math.floor(rand(0,4));
    let ex, ey;
    if(edge===0){ ex=rand(MARGIN,W-MARGIN); ey=MARGIN; }
    else if(edge===1){ ex=W-MARGIN; ey=rand(MARGIN,H-MARGIN); }
    else if(edge===2){ ex=rand(MARGIN,W-MARGIN); ey=H-MARGIN; }
    else { ex=MARGIN; ey=rand(MARGIN,H-MARGIN); }
    const ang = rand(0, Math.PI*2), spd = rand(0.025,0.045) * (1 + (scalingLevel()-1)*0.05);
    const maxHp = miniBossMaxHp();
    enemies.push({
      x:ex, y:ey, vx:Math.cos(ang)*spd, vy:Math.sin(ang)*spd, r:ENEMY_R*1.5,
      miniBoss:true, miniType:def.type, miniColor:def.color,
      hp:maxHp, maxHp:maxHp, cracked:false,
      wobbleSeed: rand(0,100),
      dashTimer: def.type==='twitcher' ? rand(400,900) : 0
    });
    showCombo(def.label);
  }
  function triggerMiniBossCrack(en){
    shockwaves.push({x:en.x, y:en.y, t:performance.now(), color:en.miniColor});
    triggerShake(5);
    spawnPop(en.x, en.y, 'CRACK!', en.miniColor);
    sfx.chain();
  }
  function triggerMiniBossDestroy(en){
    shockwaves.push({x:en.x, y:en.y, t:performance.now(), color:en.miniColor, big:true});
    shockwaves.push({x:en.x, y:en.y, t:performance.now(), color:'#fff'});
    triggerShake(10);
    sfx.bomb();
  }

  function triggerMob(){
    const count = Math.min(MOB_HARD_CAP, Math.round((40 + (scalingLevel()-1)*3) * diffTier().spawnMult));
    for(let i=0;i<count && enemies.length<MOB_HARD_CAP;i++) spawnEnemy();
    showCombo('MOB INCOMING');
  }

  function spawnBoss(colFrac, rowFrac){
    const isFinal = (level === FINAL_BOSS_LEVEL);
    const isGlob = (level === FORGED_GLOB_LEVEL);
    const isFlower = (level === FLOWER_BOSS_LEVEL);
    const isGoodBoy = (level === GOOD_BOY_LEVEL);
    const isUnique = isFinal || isGlob || isFlower || isGoodBoy;
    const shapeIndex = Math.floor(rand(0, BOSS_SHAPES.length));
    const sizeTier = BOSS_SIZE_TIERS[shapeIndex % BOSS_SIZE_TIERS.length];
    const archetype = BOSS_ARCHETYPES[shapeIndex % BOSS_ARCHETYPES.length];
    const accessory = isUnique ? 'none' : BOSS_ACCESSORIES[Math.floor(shapeIndex/BOSS_ARCHETYPES.length) % BOSS_ACCESSORIES.length];
    const baseHp = BOSS_HP + (level-1)*3;
    const r = isGlob ? FORGED_GLOB_R : (isFlower ? FLOWER_BOSS_R : (isGoodBoy ? GOOD_BOY_R : (isFinal ? FINAL_BOSS_R : sizeTier.r)));
    let hp = isGlob ? Math.round(FORGED_GLOB_HP_BASE + (level-1)*3)
      : (isFlower ? Math.round(FLOWER_BOSS_HP_BASE + (level-1)*3)
      : (isGoodBoy ? Math.round(GOOD_BOY_HP_BASE + (level-1)*3)
      : (isFinal ? Math.round(FINAL_BOSS_HP_BASE + (level-1)*3) : Math.max(2, Math.round(baseHp * sizeTier.hpMult)))));
    if(!isUnique && archetype.tanky) hp = Math.round(hp * 1.35);
    const ringThresholds = isUnique
      ? [0.85, 0.7, 0.55, 0.4, 0.25, 0.12, 0.05]
      : (archetype.ringDivisor > 1 ? [0.83, 0.66, 0.5, 0.33, 0.16, 0.05] : [0.66, 0.33, 0.05]);
    const cf = (colFrac===undefined) ? 0.5 : colFrac;
    const rf = (rowFrac===undefined) ? 0 : rowFrac;
    const areaLeft = MARGIN+r+10, areaRight = W-MARGIN-r-10;
    const areaTop = MARGIN+r+10, areaBottom = Math.min(H*0.42, areaTop+150);
    const spawnX = areaRight > areaLeft ? areaLeft + cf*(areaRight-areaLeft) : cx;
    const spawnY = areaBottom > areaTop ? areaTop + rf*(areaBottom-areaTop) : areaTop;
    const spdMult = isGlob ? 0.45 : (isFlower ? 1.3 : (isGoodBoy ? 0.9 : (isFinal ? 0.6 : sizeTier.spdMult)));
    const boss = {
      x: spawnX, y: spawnY,
      vx: rand(-0.015,0.015)*spdMult, vy: rand(0.01,0.02)*spdMult,
      r: r, baseR: r, boss: true, hp: hp, maxHp: hp, lastHit: 0,
      shapeIndex, color: isGlob ? FORGED_GLOB_COLOR : (isFlower ? FLOWER_BOSS_COLOR : (isGoodBoy ? GOOD_BOY_COLOR : (isFinal ? FINAL_BOSS_COLOR : archetype.color))),
      archetypeName: isUnique ? null : archetype.name,
      fireMult: isGlob ? 0.75 : (isFlower ? 1.0 : (isGoodBoy ? 1.1 : (isFinal ? 0.55 : archetype.fireMult))),
      fireDmgMult: isGlob ? 1.1 : (isFlower ? 0.6 : (isGoodBoy ? 1.0 : (isFinal ? 1.2 : archetype.fireDmgMult))),
      orbSpeedMult: isGlob ? 1.0 : archetype.orbSpeedMult,
      orbSizeMult: isGlob ? 1.2 : (isFinal ? 1.3 : archetype.orbSizeMult),
      auraDrain: isGlob ? 0 : archetype.auraDrain, accessory: accessory,
      isFinalBoss: isFinal, isForgedGlob: isGlob, isFlowerBoss: isFlower, isGoodBoy: isGoodBoy,
      ringThresholds, ringFired: new Array(ringThresholds.length).fill(false),
      angryUntil: 0, fireTimer: BOSS_FIRE_START_DELAY,
      regenHp: isUnique ? 0 : (archetype.regenHp||0),
      ringSpawnsMobs: !isUnique && archetype.ringSpawnsMobs,
      spawnsMobs: (isGlob || isGoodBoy) ? true : (!isUnique && archetype.spawnsMobs),
      mobSpawnTimer: rand(4000,7000),
      driftEyes: !isUnique && archetype.driftEyes,
      healsFromMobs: !isUnique && archetype.healsFromMobs,
      darkensScreen: !isUnique && archetype.darkensScreen,
      releasesSpores: !isUnique && archetype.releasesSpores,
      sporeTimer: rand(3000,5000),
      weakEye: !isUnique && archetype.weakEye,
      eyeOpen: false,
      eyeTimer: rand(1800,2800),
      mutesSfx: !isUnique && archetype.mutesSfx,
      // Forged Glob specific: fork lunge charge, glob growth, sticky splatter, final flood
      chargesAtPlayer: isGlob || isGoodBoy,
      chargeState: 'idle',
      chargeTimer: rand(4000,6000),
      chargeDX: 0, chargeDY: 0,
      growsOverTime: isGlob,
      splattersHazard: isGlob,
      splatterTimer: rand(2200,3400),
      floodsAtLowHp: isGlob,
      floodTriggered: false,
      // Stick (the flower) specific: Bloom Blast, Root Bind, Petal Dash, Healing Light
      bloomBlast: isFlower,
      bloomTimer: rand(4500,6500),
      rootBind: isFlower,
      rootTimer: rand(3500,5000),
      healsSelf: isFlower,
      healTimer: rand(6000,8000),
      dashesAway: isFlower,
      dashTimer: rand(4000,6000),
      untargetableUntil: 0,
      // The Goodest Guardian specific: Loyal Guardian proximity heal, The Look telegraph-then-strike,
      // Tennis Ball Tornado burst (Good Boy Rage reuses the charge fields above)
      healsWhenClose: isGoodBoy,
      givesTheLook: isGoodBoy,
      lookState: 'idle',
      lookTimer: rand(5000,7500),
      ballTornado: isGoodBoy,
      ballTimer: rand(4200,6200)
    };
    if(boss.mutesSfx){
      boss.prevSfxVolume = sfxVolume;
      sfxVolume = sfxVolume * 0.15;
    }
    enemies.push(boss);
    bossEntity = boss;
    showCombo(isGlob ? 'THE FORGED GLOB' : (isFlower ? 'STICK' : (isGoodBoy ? 'THE GOODEST GUARDIAN' : (isFinal ? 'BOSS' : boss.archetypeName.toUpperCase()))));
  }

  function spawnBossGroup(count){
    const cols = count <= 1 ? 1 : (count <= 3 ? count : (count <= 4 ? 2 : 3));
    const rows = Math.ceil(count/cols);
    for(let i=0;i<count;i++){
      const col = i % cols;
      const row = Math.floor(i / cols);
      const colFrac = cols > 1 ? col/(cols-1) : 0.5;
      const rowFrac = rows > 1 ? row/(rows-1) : 0;
      spawnBoss(colFrac, rowFrac);
    }
  }

  function triggerBossRing(en){
    for(let k=0;k<RING_COUNT;k++){
      const ang = (k/RING_COUNT)*Math.PI*2;
      const startR = en.r + 6;
      fireOrbs.push({
        x: en.x + Math.cos(ang)*startR, y: en.y + Math.sin(ang)*startR,
        vx: Math.cos(ang)*FIRE_SPEED*1.15*en.orbSpeedMult, vy: Math.sin(ang)*FIRE_SPEED*1.15*en.orbSpeedMult,
        r: FIRE_R*en.orbSizeMult, dmgMult: en.fireDmgMult, color: en.color
      });
    }
    if(en.ringSpawnsMobs){
      for(let k=0;k<3;k++) spawnEnemy();
      showCombo('THE BELL RINGS');
    }
    en.angryUntil = performance.now() + BOSS_ANGRY_DURATION;
    triggerShake(9);
    showCombo('BOSS RAGE');
  }

  function checkBossRingAttack(en){
    const frac = en.hp / en.maxHp;
    for(let i=0;i<en.ringThresholds.length;i++){
      if(!en.ringFired[i] && frac <= en.ringThresholds[i]){
        en.ringFired[i] = true;
        triggerBossRing(en);
      }
    }
  }

  function spawnFireOrb(boss){
    if(!boss) return;
    const ang = Math.atan2(pivotY-boss.y, pivotX-boss.x) + rand(-0.2,0.2);
    fireOrbs.push({
      x: boss.x, y: boss.y,
      vx: Math.cos(ang)*FIRE_SPEED*boss.orbSpeedMult, vy: Math.sin(ang)*FIRE_SPEED*boss.orbSpeedMult,
      r: FIRE_R*boss.orbSizeMult, dmgMult: boss.fireDmgMult, color: boss.color
    });
  }

  function spawnMobShot(){
    const shooters = enemies.filter(e=>!e.boss);
    if(!shooters.length) return;
    const shooter = shooters[Math.floor(rand(0,shooters.length))];
    const ang = Math.atan2(pivotY-shooter.y, pivotX-shooter.x) + rand(-0.25,0.25);
    mobShots.push({
      x: shooter.x, y: shooter.y,
      vx: Math.cos(ang)*MOB_SHOT_SPEED, vy: Math.sin(ang)*MOB_SHOT_SPEED,
      r: MOB_SHOT_R
    });
  }

  function killBoss(en){
    spawnPop(en.x, en.y, '+' + BOSS_KILL_BONUS);
    addHealth(HEALTH_BOSS_KILL);
    if(en.mutesSfx && en.prevSfxVolume !== undefined) sfxVolume = en.prevSfxVolume;
    triggerShake(10);
    sfx.gong();
    // a boss doesn't just vanish - it comes apart
    spawnDebris(en.x, en.y, en.color || ENEMY_COLOR, 70, 2.1);
    spawnDebris(en.x, en.y, '#ffffff', 18, 2.6);

    const anyBossLeft = enemies.some(e=>e.boss);
    if(!anyBossLeft){
      bossActive = false;
      bossUnlocked = false;
      restartMusicLoop();
      bossEntity = null;
      fireOrbs.length = 0;
      sporeClouds.length = 0;
      targetStickScale = STICK_NORMAL_SCALE;
      wrap.classList.remove('boss-mode');
      bossTintExtra = 0;
      bossCooldown = 4000;
    } else if(bossEntity === en){
      bossEntity = enemies.find(e=>e.boss) || null;
    }

    bossesThisLevel += 1;
    const required = currentBossesRequired;
    if(bossesThisLevel < required){
      // more bosses to clear before this level is done - no level screen yet
      addScore(BOSS_KILL_BONUS, 'BOSS ' + bossesThisLevel + '/' + required);
      return;
    }

    addScore(BOSS_KILL_BONUS, 'BOSS DOWN');
    bossesThisLevel = 0;
    level += 1;
    bossDeathPause = true;

  function triggerSlam(x,y){
    shockwaves.push({x,y,t:performance.now()});

    addScore(SLAM_SCORE, 'SLAM');
    for(let i=enemies.length-1;i>=0;i--){
      const en = enemies[i];
      if(Math.hypot(en.x-x, en.y-y) < SLAM_AOE_R + en.r){
        if(en.boss){
          if(en.weakEye && !en.eyeOpen){
            if(performance.now() - (en.lastShieldPop||0) > 300){
              en.lastShieldPop = performance.now();
              spawnPop(en.x, en.y, 'SHIELDED', '#8a8a8a');
            }
            continue;
          }
          if(en.untargetableUntil && performance.now() < en.untargetableUntil){
            if(performance.now() - (en.lastShieldPop||0) > 300){
              en.lastShieldPop = performance.now();
              spawnPop(en.x, en.y, 'UNTARGETABLE', '#2dd4d4');
            }
            continue;
          }
          const weakBonus = (en.weakEye && en.eyeOpen) ? 2 : 1;
          en.hp -= 1*bossDamageMult()*weakBonus; en.lastHit = performance.now();
          checkBossRingAttack(en);
          if(en.hp <= 0){
            enemies.splice(i,1);
            killBoss(en);
          } else {
            spawnPop(en.x, en.y, '+' + (BOSS_HIT_SCORE*weakBonus));
            addScore(BOSS_HIT_SCORE*weakBonus, 'BOSS HIT');
            addHealth(HEALTH_BOSS_HIT);
            en.angryUntil = Math.max(en.angryUntil, performance.now() + BOSS_HIT_ANGRY_MS);
          }
        } else if(en.miniBoss){
          en.hp -= 1*bossDamageMult();

              triggerMiniBossCrack(en);

          enemies.splice(i,1);

  // Physical debris: each fragment gets real velocity, gravity, air drag and
  // spin, so kills throw actual matter instead of just floating a number.
  const debris = [];
  const DEBRIS_MAX = 260, DEBRIS_LIFETIME = 850;
  const DEBRIS_GRAVITY = 0.00048, DEBRIS_DRAG = 0.9965;
  function spawnDebris(x, y, color, count, speedMult){
    const n = Math.min(count, DEBRIS_MAX - debris.length);
    const sm = speedMult || 1;
    for(let i=0;i<n;i++){
      const ang = rand(0, Math.PI*2);
      const spd = rand(0.05, 0.24) * sm;
      debris.push({
        x, y,
        vx: Math.cos(ang)*spd, vy: Math.sin(ang)*spd - rand(0, 0.05),
        size: rand(1.4, 3.6),
        rot: rand(0, Math.PI*2), spin: rand(-0.02, 0.02),
        color, born: performance.now(),
        life: DEBRIS_LIFETIME * rand(0.6, 1.25),
        shard: Math.random() < 0.45
      });
    }
  }
  function updateDebris(dt, now){
    for(let i=debris.length-1;i>=0;i--){
      const d = debris[i];
      if(now - d.born > d.life){ debris.splice(i,1); continue; }
      d.vy += DEBRIS_GRAVITY*dt;
      const drag = Math.pow(DEBRIS_DRAG, dt);
      d.vx *= drag; d.vy *= drag;
      d.x += d.vx*dt; d.y += d.vy*dt;
      d.rot += d.spin*dt;
      // bounce off the floor with energy loss, so debris settles believably
      if(d.y > H-MARGIN && d.vy > 0){
        d.y = H-MARGIN;
        d.vy *= -0.42;
        d.vx *= 0.7;
        d.spin *= 0.6;
      }
    }
  }
  function drawDebris(now){
    for(let i=0;i<debris.length;i++){
      const d = debris[i];
      const age = (now - d.born)/d.life;
      const fade = Math.max(0, 1-age);
      ctx.save();
      ctx.translate(d.x, d.y);
      ctx.rotate(d.rot);
      ctx.globalAlpha = fade;
      ctx.shadowColor = d.color;
      ctx.shadowBlur = 6*fade;
      ctx.fillStyle = d.color;
      if(d.shard){
        // angular shard - reads as broken matter
        ctx.beginPath();
        ctx.moveTo(-d.size, -d.size*0.4);
        ctx.lineTo(d.size, 0);
        ctx.lineTo(-d.size*0.6, d.size*0.7);
        ctx.closePath();
        ctx.fill();
      } else {
        ctx.beginPath();
        ctx.arc(0, 0, d.size*fade, 0, Math.PI*2);
        ctx.fill();
      }
      ctx.restore();
    }
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }

  function stickWorldSegment(){
    const anchor = ANCHORS[anchorIndex];
    let leftArm = -SHORT - anchor, rightArm = LONG - anchor;
    leftArm *= stickScale; rightArm *= stickScale;
    const ct = Math.cos(theta), st = Math.sin(theta);
    return {
      x1: pivotX + leftArm*ct, y1: pivotY + leftArm*st,
      x2: pivotX + rightArm*ct, y2: pivotY + rightArm*st
    };
  }

  function echoStickWorldSegment(){
    const seg = stickWorldSegment();
    return {
      x1: pivotX - (seg.x1-pivotX), y1: pivotY - (seg.y1-pivotY),
      x2: pivotX - (seg.x2-pivotX), y2: pivotY - (seg.y2-pivotY)
    };
  }

  function getAppendageWorldPos(){
    const anchor = ANCHORS[anchorIndex];
    const leftArm = (-SHORT - anchor) * stickScale;
    const localX = leftArm - 12*stickScale;
    const ct = Math.cos(theta), st = Math.sin(theta);
    return { x: pivotX + localX*ct, y: pivotY + localX*st };
  }

  function spawnMagicOrb(){
    const pos = getAppendageWorldPos();
    for(let k=0;k<MAGIC_ORB_BURST;k++){
      const ang = rand(0, Math.PI*2);
      magicOrbs.push({
        x: pos.x, y: pos.y,
        vx: Math.cos(ang)*MAGIC_ORB_SPEED, vy: Math.sin(ang)*MAGIC_ORB_SPEED,
        born: performance.now(), target: null, trail: []
      });
    }
    lastMagicFireTime = performance.now();
  }

  function distToSegment(px,py,x1,y1,x2,y2){
    const dx = x2-x1, dy = y2-y1;
    const lenSq = dx*dx + dy*dy;
    let t = lenSq > 0 ? ((px-x1)*dx + (py-y1)*dy)/lenSq : 0;
    t = Math.max(0, Math.min(1, t));
    return Math.hypot(px-(x1+t*dx), py-(y1+t*dy));
  }

  function onDown(e){
    if(introActive) return;
    if(powerCutsceneActive) return;
    if(paused) return;
    if(gameOver){ reset(); return; }
    if(levelTransition) return;
    if(mode==='autostrike') return;
    const p = pointerPos(e);
    const wasFlying = (mode==='thrown' || mode==='freespin');
    holding = true;
    vx = 0; vy = 0;
    anchorIndex = (anchorIndex + 1) % ANCHORS.length;
    lastPx = p.x; lastPy = p.y; lastT = performance.now();
    holdRotAccum = 0;
    angularVel = 0;
    elasticLaunch = false;
    if(wasFlying){
      mode = 'spring';
      springAnchor.x = pivotX; springAnchor.y = pivotY;
      lastAngle = angleTo(p.x,p.y);
      theta = lastAngle;
      addScore(5, 'CATCH');
    } else {
      mode = 'held';
      lastAngle = angleTo(p.x,p.y);
      theta = lastAngle;
      grabStartX = p.x; grabStartY = p.y;
    }
  }

  function onMove(e){
    if(!holding) return;
    const p = pointerPos(e);
    const now = performance.now();
    const dt = Math.max(1, now-lastT);

    if(mode==='spring'){
      let dx = p.x - springAnchor.x, dy = p.y - springAnchor.y;
      const dist = Math.hypot(dx,dy);
      pivotX = springAnchor.x + dx;
      pivotY = springAnchor.y + dy;
      if(dist > 4){
        theta = Math.atan2(-dy, -dx); // aims opposite the pull, like a drawn arrow
      }
      lastPx = p.x; lastPy = p.y; lastT = now;
      return;
    }

    if(mode==='held'){
      const downDelta = p.y - grabStartY;
      const acrossDelta = Math.abs(p.x - grabStartX);
      if(downDelta > SWIPE_DOWN_TRIGGER && downDelta > acrossDelta*1.2){
        mode = 'spring';
        springAnchor.x = pivotX; springAnchor.y = pivotY;
        lastPx = p.x; lastPy = p.y; lastT = now;
        return;
      }
    }

    const newAngle = angleTo(p.x,p.y);
    const delta = norm(newAngle-lastAngle);
    const instAngVel = delta/dt;
    angularVel = angularVel*0.6 + instAngVel*0.4;
    theta = newAngle;
    holdRotAccum += Math.abs(delta);

    // velocity sampling weighted toward the most recent motion, so a quick final flick isn't averaged away
    const ivx = (p.x-lastPx)/dt, ivy = (p.y-lastPy)/dt;
    onMove.vx = (onMove.vx||0)*0.35 + ivx*0.65;
    onMove.vy = (onMove.vy||0)*0.35 + ivy*0.65;

    lastAngle = newAngle; lastPx = p.x; lastPy = p.y; lastT = now;
  }

  function onUp(e){
    if(!holding) return;
    holding = false;

    if(mode==='spring'){
      const dx = pivotX - springAnchor.x, dy = pivotY - springAnchor.y;
      const pull = Math.hypot(dx,dy);
      if(pull > MIN_SHOT_PULL){
        vx = -dx * SPRING_POWER;
        vy = -dy * SPRING_POWER;
        const spd = Math.hypot(vx,vy);
        if(spd > MAX_SHOT_SPEED){ const s = MAX_SHOT_SPEED/spd; vx*=s; vy*=s; }
        angularVel = (Math.random()>0.5?1:-1) * Math.min(0.02, 0.006 + pull*0.00012);
        pivotX = springAnchor.x; pivotY = springAnchor.y;
        mode = 'thrown';
        elasticLaunch = true;
        addScore(4, 'SHOT');
      } else {
        mode = 'idle'; angularVel = 0;
      }
      return;
    }

    const speedAng = Math.abs(angularVel);
    const lvx = onMove.vx||0, lvy = onMove.vy||0;
    const speedLin = Math.hypot(lvx,lvy);
    const isUpFast = speedLin > STRIKE_LIN_TH && lvy < -Math.abs(lvx)*0.5;

    if(isUpFast){
      mode = 'thrown';
      elasticLaunch = false;
      vx = lvx*STRIKE_MULT; vy = lvy*STRIKE_MULT;
      angularVel = angularVel*1.1 || (Math.random()>0.5?0.008:-0.008);
      addScore(2, 'STRIKE');
      onMove.vx = 0; onMove.vy = 0;
      return;
    }

    const rx = Math.cos(lastAngle), ry = Math.sin(lastAngle);
    const radial = lvx*rx + lvy*ry;
    const tangential = -lvx*ry + lvx*0 + lvy*rx; // approx perpendicular component
    const isThrow = speedLin > THROW_LIN_TH && Math.abs(radial) > Math.abs(tangential)*0.6;

    if(isThrow){
      mode = 'thrown';
      elasticLaunch = false;
      vx = lvx*1.15; vy = lvy*1.15;
      angularVel = angularVel*1.4 || (Math.random()>0.5?0.01:-0.01);
      addScore(3, 'THROW');
    } else if(speedAng > FLICK_TH){
      mode = 'freespin'; spinAccum = 0;
      angularVel *= FLICK_DAMPEN;
      addScore(2, 'FLICK');
    } else if(speedAng > SPIN_TH){
      mode = 'freespin'; spinAccum = 0;
      addScore(2, 'SPIN');
    } else if(holdRotAccum > WAVE_ROT_TH){
      mode = 'idle'; angularVel = 0;
      addScore(1, 'WAVE');
    } else {
      mode = 'idle'; angularVel = 0;
    }
    onMove.vx = 0; onMove.vy = 0;
  }

  // Cinematic audio for the intro. Browsers block audio until a user gesture,
  // so the dialogue stings only sound once audio is unlocked (e.g. after the
  // first tap or on a replay) - the riser and impact always land, since those
  // fire after the tap that triggers the finisher.
  function cineRiser(duration){
    if(!soundOn || !audioCtx || sfxVolume <= 0) return;
    const t0 = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const filt = audioCtx.createBiquadFilter();
    filt.type = 'bandpass';
    filt.Q.value = 6;
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(90, t0);
    osc.frequency.exponentialRampToValueAtTime(1400, t0+duration);
    filt.frequency.setValueAtTime(200, t0);
    filt.frequency.exponentialRampToValueAtTime(3600, t0+duration);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(0.14*sfxVolume, t0+duration*0.85);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0+duration);
    osc.connect(filt); filt.connect(gain);
    gain.connect(masterBus || audioCtx.destination);
    osc.start(t0); osc.stop(t0+duration+0.05);
  }
  function cineImpact(){
    if(!soundOn || !audioCtx || sfxVolume <= 0) return;
    const t0 = audioCtx.currentTime;
    // low body
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(160, t0);
    osc.frequency.exponentialRampToValueAtTime(34, t0+0.5);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.32*sfxVolume, t0+0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+0.6);
    osc.connect(g); g.connect(masterBus || audioCtx.destination);
    osc.start(t0); osc.stop(t0+0.65);
    // noise crack on top
    const len = Math.floor(audioCtx.sampleRate*0.25);
    const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i] = (Math.random()*2-1)*Math.pow(1-i/len, 3);
    const src = audioCtx.createBufferSource();
    const ng = audioCtx.createGain();
    const nf = audioCtx.createBiquadFilter();
    nf.type = 'highpass'; nf.frequency.value = 900;
    src.buffer = buf;
    ng.gain.value = 0.22*sfxVolume;
    src.connect(nf); nf.connect(ng);
    ng.connect(masterBus || audioCtx.destination);
    src.start(t0);
  }
  function cineLineSting(side){
    if(!soundOn || !audioCtx || sfxVolume <= 0) return;
    const t0 = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    const f = audioCtx.createBiquadFilter();
    f.type = 'lowpass';
    f.frequency.value = side==='stick' ? 3000 : 1100;
    osc.type = side==='stick' ? 'triangle' : 'sawtooth';
    const base = side==='stick' ? 520 : 150;
    osc.frequency.setValueAtTime(base, t0);
    osc.frequency.exponentialRampToValueAtTime(base*0.7, t0+0.16);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.09*sfxVolume, t0+0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+0.22);
    osc.connect(f); f.connect(g);
    g.connect(masterBus || audioCtx.destination);
    osc.start(t0); osc.stop(t0+0.26);
  }

  function dismissIntro(e){
    if(!introActive || introFinishing) return;
    if(e) e.stopPropagation();
    introFinishing = true;
    if(introTimeout) clearTimeout(introTimeout);
    introBubbleEl.style.opacity = '0';
    introPromptEl.style.display = 'none';
    // audio is unlocked by this tap, so the cinematic cues land from here on
    ensureAudio();
    cineRiser(0.94);

    const stickEl = introEl.querySelector('.introStick');
    const mobsEl = introEl.querySelector('.introMobs');
    const stickRect = stickEl.getBoundingClientRect();
    const mobsRect = mobsEl.getBoundingClientRect();
    const dx = (mobsRect.left + mobsRect.width/2) - (stickRect.left + stickRect.width/2);
    const dy = (mobsRect.top + mobsRect.height/2) - stickRect.top - 20;
    stickEl.style.setProperty('--finishDX', dx.toFixed(0) + 'px');
    stickEl.style.setProperty('--finishDY', dy.toFixed(0) + 'px');
    stickEl.classList.add('finisher');

    setTimeout(()=>{
      introEl.classList.add('shake');
      introFlashEl.classList.add('flash');
      mobsEl.classList.add('smashed');
      introEl.classList.remove('cineIn'); // letterbox retracts as we cut to play
      cineImpact();
      setTimeout(()=>{
        introEl.classList.remove('shake');
        introFlashEl.classList.remove('flash');
      }, 320);
    }, 940);

    setTimeout(()=>{
      introActive = false;
      introEl.style.display = 'none';
      lastTime = performance.now();
      ensureAudio();
      startMusic();
    }, 1650);
  }
  introEl.addEventListener('pointerdown', dismissIntro);

  const diffBtns = difficultyPickerEl.querySelectorAll('.diffBtn');
  diffBtns.forEach(btn=>{
