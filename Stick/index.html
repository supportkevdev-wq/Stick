  function drawStick(){
    const anchor = ANCHORS[anchorIndex];
    let leftArm = -SHORT - anchor;
    let rightArm = LONG - anchor;
    leftArm *= stickScale; rightArm *= stickScale;
    const overcharged = level >= 10;
    ctx.save();
    ctx.translate(pivotX, pivotY);
    ctx.rotate(theta);
    if(overcharged){
      const now = performance.now();
      const pulse = 0.5 + 0.5*Math.sin(now*0.0035);
      const pulseR = (26 + 20*pulse) * stickScale;
      const grad = ctx.createRadialGradient(0,0,0, 0,0, pulseR);
      grad.addColorStop(0, 'rgba(255,209,102,' + (0.55*pulse+0.25).toFixed(2) + ')');
      grad.addColorStop(0.55, 'rgba(255,209,102,' + (0.22*pulse+0.08).toFixed(2) + ')');
      grad.addColorStop(1, 'rgba(255,209,102,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(0, 0, pulseR, 0, Math.PI*2);
      ctx.fill();
      ctx.shadowColor = '#ffd166';
      ctx.shadowBlur = 16 + 10*pulse;
    }
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = Math.max(2, 6*stickScale);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(leftArm, 0);
    ctx.lineTo(rightArm, 0);
    ctx.stroke();
    // weight at the long end
    ctx.beginPath();
    ctx.arc(rightArm, 0, Math.max(3, WEIGHT_R*stickScale), 0, Math.PI*2);
    ctx.fill();
    // grip mark at pivot (current rotation axis)
    ctx.beginPath();
    ctx.arc(0, 0, 3, 0, Math.PI*2);
    ctx.fill();
    if(overcharged){
      drawFlamingBranches(rightArm, stickScale);
    }
    if(level >= MAGIC_ORB_LEVEL){
      drawMagicAppendage(leftArm, stickScale);
    }
    if(level >= FINAL_BOSS_LEVEL){
      drawTwinEcho(leftArm, rightArm, stickScale);
    }
    ctx.shadowBlur = 0;
    ctx.restore();
  }

  function drawTwinEcho(leftArm, rightArm, sc){
    const now = performance.now();
    const pulse = 0.7 + 0.3*Math.sin(now*0.006);
    ctx.shadowColor = FINAL_BOSS_AURA_COLOR;
    ctx.shadowBlur = 14*pulse;
    ctx.strokeStyle = '#8b0020';
    ctx.lineWidth = Math.max(2, 6*sc);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-leftArm, 0);
    ctx.lineTo(-rightArm, 0);
    ctx.stroke();
    ctx.fillStyle = '#8b0020';
    ctx.beginPath();
    ctx.arc(-rightArm, 0, Math.max(3, WEIGHT_R*sc), 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  function drawMagicAppendage(leftArm, sc){
    const now = performance.now();
    const x = leftArm - 12*sc, y = 0;
    const pulse = 0.85 + 0.15*Math.sin(now*0.006);
    const hue = (now*0.05) % 360;
    const sinceFire = now - lastMagicFireTime;
    const kick = sinceFire < 140 ? (1 - sinceFire/140) : 0;
    ctx.save();
    ctx.translate(x, y);
    const r = 15*sc*pulse*(1 + kick*0.6);
    ctx.shadowColor = 'hsl(' + hue.toFixed(0) + ',95%,68%)';
    ctx.shadowBlur = (20*pulse) + kick*22;
    const grad = ctx.createRadialGradient(0,0,0, 0,0, r);
    grad.addColorStop(0, '#fff');
    grad.addColorStop(0.4, 'hsl(' + hue.toFixed(0) + ',95%,68%)');
    grad.addColorStop(0.75, 'hsl(' + ((hue+90)%360).toFixed(0) + ',95%,60%)');
    grad.addColorStop(1, 'rgba(192,132,252,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI*2);
    ctx.fill();
    if(kick > 0){
      ctx.globalAlpha = kick*0.8;
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(0, 0, r*0.5, 0, Math.PI*2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
    // small orbiting sparkles for extra arcane flair
    ctx.shadowBlur = 8;
    for(let k=0;k<3;k++){
      const orbitAng = now*0.004 + k*(Math.PI*2/3);
      const orbitR = r*1.35;
      const sx = Math.cos(orbitAng)*orbitR, sy = Math.sin(orbitAng)*orbitR;
      const sHue = (hue + k*120) % 360;
      ctx.fillStyle = 'hsl(' + sHue.toFixed(0) + ',95%,72%)';
      ctx.shadowColor = ctx.fillStyle;
      ctx.beginPath();
      ctx.arc(sx, sy, Math.max(1.5, 2.4*sc), 0, Math.PI*2);
      ctx.fill();
    }
    ctx.shadowBlur = 0;
    ctx.restore();
  }

  function drawFlamingBranches(rightArm, sc){
    const now = performance.now();
    const baseX = rightArm - 4*sc, baseY = 0;
    const angles = [-0.55, 0, 0.55];
    for(let b=0;b<3;b++){
      const wob = Math.sin(now*0.0025 + b*2.3)*0.08;
      const len = (34 + Math.sin(now*0.003 + b*1.7)*3) * sc;
      const a = angles[b] + wob;
      const midX = baseX + Math.cos(a)*len*0.5;
      const midY = baseY + Math.sin(a)*len*0.5 - len*0.12;
      const tipX = baseX + Math.cos(a)*len;
      const tipY = baseY + Math.sin(a)*len;
      ctx.shadowBlur = 0;
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = Math.max(2.5, 3.6*sc);
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(baseX, baseY);
      ctx.quadraticCurveTo(midX, midY, tipX, tipY);
      ctx.stroke();
      drawFlameAt(tipX, tipY, sc, b);
    }
  }

  function drawFlameAt(x, y, sc, seed){
    const now = performance.now();
    const flick = 0.85 + 0.15*Math.sin(now*0.015 + seed*2.4);
    const h = 15*sc*flick, w = 8*sc*flick;
    ctx.save();
    ctx.translate(x, y);
    ctx.shadowColor = '#ff6a00';
    ctx.shadowBlur = 12;
    ctx.fillStyle = '#ff6a00';
    ctx.beginPath();
    ctx.moveTo(0, h*0.6);
    ctx.quadraticCurveTo(w, 0, 0, -h);
    ctx.quadraticCurveTo(-w, 0, 0, h*0.6);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#ffd166';
    ctx.beginPath();
    ctx.moveTo(0, h*0.25);
    ctx.quadraticCurveTo(w*0.5, -h*0.1, 0, -h*0.55);
    ctx.quadraticCurveTo(-w*0.5, -h*0.1, 0, h*0.25);
    ctx.fill();
    ctx.restore();
  }

  function draw(){
    ctx.clearRect(0,0,W,H);
    ctx.save();
    if(shakeMag > 0.05){
      ctx.translate((Math.random()-0.5)*shakeMag, (Math.random()-0.5)*shakeMag);
    }
    drawNebulae(performance.now());
    drawPlanets();
    drawStars();
    drawShootingStars();
    drawEnemies();
    drawBlackHole();
    drawJellies();
    drawFireOrbs();
    drawSporeClouds();
    drawMobShots();
    drawMagicOrbs();
    drawChainSparks();
    drawDebris(performance.now());
    drawPops();
    drawShockwaves();
    drawSpring();
    drawTrail();
    drawStick();
    applySceneLighting(performance.now());
    drawMotes(performance.now());
    if(bossTintExtra > 0.01){
      ctx.fillStyle = 'rgba(5,0,15,' + bossTintExtra.toFixed(2) + ')';
      ctx.fillRect(0,0,W,H);
    }
    ctx.restore();
    applyBloom();
  }

  // Dynamic light casting. Every emitter in the scene projects a real light
  // pool, composited with 'overlay' - which brightens mid-tones but leaves
  // black untouched. That's physically how light behaves: it only shows where
  // there's a surface to catch it, so objects visibly brighten as a light
  // source passes near them instead of glow just floating over empty space.
  function castLight(x, y, radius, color, intensity){
    if(radius <= 0 || intensity <= 0.01) return;
    const g = ctx.createRadialGradient(x, y, 0, x, y, radius);
    g.addColorStop(0, hexToRgba(color, Math.min(0.95, intensity)));
    g.addColorStop(0.45, hexToRgba(color, intensity*0.42));
    g.addColorStop(1, hexToRgba(color, 0));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, radius, 0, Math.PI*2);
    ctx.fill();
  }
  function applySceneLighting(now){
    ctx.save();
    ctx.globalCompositeOperation = 'overlay';

    // the stick is the player's own lantern - brighter once overcharged
    const stickFlicker = 0.92 + 0.08*Math.sin(now*0.007);
    if(level >= MAGIC_ORB_LEVEL){
      castLight(pivotX, pivotY, 120*stickFlicker, '#c084fc', 0.26);
    }
    if(level >= 10){
      castLight(pivotX, pivotY, 105*stickFlicker, '#ffd166', 0.28);
    } else {
      castLight(pivotX, pivotY, 85*stickFlicker, '#8fd8ff', 0.2);
    }

    // bosses light the room around them, pulsing with their aura
    for(let i=0;i<enemies.length;i++){
      const en = enemies[i];
      if(!en.boss) continue;
      const p = 0.8 + 0.2*Math.sin(now*0.003 + (en.shapeIndex||0));
      castLight(en.x, en.y, en.r*2.2*p, en.color || ENEMY_COLOR, 0.25);
    }

    // projectiles are small moving light sources
    for(let i=0;i<fireOrbs.length;i++){
      const f = fireOrbs[i];
      castLight(f.x, f.y, 42, f.color || '#ff6a00', 0.28);
    }
    for(let i=0;i<magicOrbs.length;i++){
      const o = magicOrbs[i];
      const hue = (now*0.12 + i*47) % 360;
      const g = ctx.createRadialGradient(o.x, o.y, 0, o.x, o.y, 48);
      g.addColorStop(0, 'hsla(' + hue.toFixed(0) + ',95%,65%,0.3)');
      g.addColorStop(1, 'hsla(' + hue.toFixed(0) + ',95%,65%,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(o.x, o.y, 48, 0, Math.PI*2); ctx.fill();
    }

    // explosions throw a brief hard flash of light as they expand
    for(let i=0;i<shockwaves.length;i++){
      const sw = shockwaves[i];
      const age = now - sw.t;
      const t = age / SHOCK_LIFETIME;
      if(t < 0 || t > 1) continue;
      const flash = Math.pow(1-t, 2.2);
      castLight(sw.x, sw.y, (sw.big?110:70)*(0.4+t), sw.color || '#00eaff', flash*0.45);
    }

    ctx.globalCompositeOperation = 'source-over';
    ctx.restore();
  }

  // film grain: one small noise tile generated once, then scrolled and scaled
  // each frame so the texture never visibly repeats or sits static
  let grainCanvas = null;
  function buildGrain(){
    grainCanvas = document.createElement('canvas');
    grainCanvas.width = 128; grainCanvas.height = 128;
    const gctx = grainCanvas.getContext('2d');
    const img = gctx.createImageData(128,128);
    for(let i=0;i<img.data.length;i+=4){
      const v = 128 + (Math.random()*2-1)*90;
      img.data[i] = v; img.data[i+1] = v; img.data[i+2] = v; img.data[i+3] = 255;
    }
    gctx.putImageData(img,0,0);
  }
  buildGrain();

  // foreground dust motes: drift in front of everything, catching light. Gives
  // real depth cueing - the eye reads "there is air between me and the scene".
  const motes = [];
  const MOTE_COUNT = 34;
  function initMotes(){
    motes.length = 0;
    for(let i=0;i<MOTE_COUNT;i++){
      motes.push({
        x: rand(0,1), y: rand(0,1),
        vx: rand(-0.012,0.012), vy: rand(-0.008,0.004),
        r: rand(0.6,2.4), depth: rand(0.3,1),
        seed: rand(0,100)
      });
    }
  }
  initMotes();
  function updateMotes(dt){
    for(let i=0;i<motes.length;i++){
      const m = motes[i];
      m.x += m.vx*dt*0.001*m.depth;
      m.y += m.vy*dt*0.001*m.depth;
      if(m.x < -0.05) m.x = 1.05; else if(m.x > 1.05) m.x = -0.05;
      if(m.y < -0.05) m.y = 1.05; else if(m.y > 1.05) m.y = -0.05;
    }
  }
  function drawMotes(now){
    for(let i=0;i<motes.length;i++){
      const m = motes[i];
      // nearer motes drift further with the stick, selling parallax depth
      const px = m.x*W + (pivotX - W/2)*0.02*m.depth;
      const py = m.y*H + (pivotY - H/2)*0.02*m.depth;
      const shimmer = 0.4 + 0.6*Math.abs(Math.sin(now*0.0012 + m.seed));
      ctx.globalAlpha = 0.16*shimmer*m.depth;
      ctx.fillStyle = '#dff2ff';
      ctx.shadowColor = '#dff2ff';
      ctx.shadowBlur = 4*m.depth;
      ctx.beginPath();
      ctx.arc(px, py, m.r*m.depth, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }

  function applyBloom(){
    if(!bloomEnabled || !bloomCanvas.width) return;
    const bw = bloomCanvas.width, bh = bloomCanvas.height;
    // downscale the finished frame into the small buffer
    bloomCtx.globalCompositeOperation = 'source-over';
    bloomCtx.clearRect(0,0,bw,bh);
    bloomCtx.drawImage(canvas, 0, 0, bw, bh);
    // keep only the bright areas so dark pixels don't wash out - multiplying
    // the buffer by itself pushes dim pixels toward black and leaves highlights
    bloomCtx.globalCompositeOperation = 'multiply';
    bloomCtx.drawImage(bloomCanvas, 0, 0);
    bloomCtx.globalCompositeOperation = 'source-over';

    ctx.save();
    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.globalCompositeOperation = 'lighter';
    const hasFilter = (typeof ctx.filter === 'string');

    // chromatic aberration: the red and blue channels of the bloom are drawn
    // very slightly offset from green, the way a real lens fails to focus all
    // wavelengths to the same point. Offset scales with screen shake so impacts
    // visibly stress the "lens".
    const ca = 1.1 + Math.min(3.5, shakeMag*0.28);
    if(hasFilter){
      ctx.filter = 'blur(6px) saturate(130%)';
      ctx.globalAlpha = 0.15;
      ctx.drawImage(bloomCanvas, -ca, 0, W, H);
      ctx.drawImage(bloomCanvas, ca, 0, W, H);
      ctx.globalAlpha = 0.17;
      ctx.drawImage(bloomCanvas, 0, 0, W, H);
      ctx.filter = 'none';
    } else {
      ctx.globalAlpha = 0.28;
      ctx.drawImage(bloomCanvas, 0, 0, W, H);
    }

    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';

    // film grain - subtle, animated, gives the flat vector art a photographic
    // texture instead of looking perfectly clean
    if(grainCanvas){
      const gx = -Math.random()*128, gy = -Math.random()*128;
      ctx.globalCompositeOperation = 'overlay';
      ctx.globalAlpha = 0.055;
      const pat = ctx.createPattern(grainCanvas, 'repeat');
      if(pat){
        ctx.save();
        ctx.translate(gx, gy);
        ctx.fillStyle = pat;
        ctx.fillRect(0, 0, W+128, H+128);
        ctx.restore();
      }
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    }

    // radial zoom blur: on heavy impacts the bloom layer is redrawn scaled up
    // from centre in successive steps, smearing light outward from the point
    // of force. Reads as the camera physically recoiling from the blast.
    if(shakeMag > 2.5){
      const force = Math.min(1, (shakeMag-2.5)/9);
      ctx.globalCompositeOperation = 'lighter';
      const steps = 5;
      for(let s=1;s<=steps;s++){
        const scale = 1 + (s/steps)*0.13*force;
        const sw = W*scale, sh = H*scale;
        ctx.globalAlpha = 0.13*force*(1 - s/(steps+1));
        ctx.drawImage(bloomCanvas, (W-sw)/2, (H-sh)/2, sw, sh);
      }
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    }

    // lens vignette - darkens the corners like real optics, framing the action
    const vgrad = ctx.createRadialGradient(W/2, H/2, Math.min(W,H)*0.35, W/2, H/2, Math.max(W,H)*0.78);
    vgrad.addColorStop(0, 'rgba(0,0,0,0)');
    vgrad.addColorStop(1, 'rgba(0,0,0,0.42)');
    ctx.fillStyle = vgrad;
    ctx.fillRect(0,0,W,H);

    ctx.restore();
  }

  function drawMobShots(){
    ctx.shadowColor = ENEMY_COLOR;
    ctx.shadowBlur = 9;
    const lightC = shadeColor(ENEMY_COLOR, 60);
    for(let i=0;i<mobShots.length;i++){
      const ms = mobShots[i];
      const grad = ctx.createRadialGradient(ms.x-ms.r*0.3, ms.y-ms.r*0.3, ms.r*0.1, ms.x, ms.y, ms.r);
      grad.addColorStop(0, lightC);
      grad.addColorStop(1, ENEMY_COLOR);
      ctx.beginPath();
      ctx.arc(ms.x, ms.y, ms.r, 0, Math.PI*2);
      ctx.fillStyle = grad;
      ctx.fill();
    }
    ctx.shadowBlur = 0;
  }

  function drawMagicOrbs(){
    const now = performance.now();
    for(let i=0;i<magicOrbs.length;i++){
      const o = magicOrbs[i];
      const flick = 0.85 + 0.15*Math.sin(now*0.02 + i);
      const hue = (now*0.12 + i*47) % 360;
      const hue2 = (hue + 90) % 360;
      const r = MAGIC_ORB_R * MAGIC_ORB_VISUAL_MULT * flick;
      const outerColor = 'hsl(' + hue.toFixed(0) + ',95%,65%)';
      const innerColor = 'hsl(' + hue2.toFixed(0) + ',95%,72%)';
      // fading trail so the spiral-then-homing path actually reads
      if(o.trail && o.trail.length > 1){
        for(let t=0;t<o.trail.length-1;t++){
          const pt = o.trail[t];
          const frac = (t+1)/o.trail.length;
          ctx.globalAlpha = frac*0.35;
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, r*0.35*frac, 0, Math.PI*2);
          ctx.fillStyle = outerColor;
          ctx.fill();
        }
        ctx.globalAlpha = 1;
      }
      // big soft outer glow
      ctx.shadowColor = outerColor;
      ctx.shadowBlur = 22*flick;
      ctx.beginPath();
      ctx.arc(o.x, o.y, r, 0, Math.PI*2);
      ctx.fillStyle = outerColor;
      ctx.fill();
      // shimmering second layer, offset hue
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 0.65;
      ctx.beginPath();
      ctx.arc(o.x, o.y, r*0.62, 0, Math.PI*2);
      ctx.fillStyle = innerColor;
      ctx.fill();
      ctx.globalAlpha = 1;
      // bright white-hot core
      ctx.beginPath();
      ctx.arc(o.x, o.y, r*0.3, 0, Math.PI*2);
      ctx.fillStyle = '#fff';
      ctx.fill();
    }
    ctx.shadowBlur = 0;
  }

  function drawChainSparks(){
    const now = performance.now();
    for(let i=chainSparks.length-1;i>=0;i--){
      const sp = chainSparks[i];
      const age = now - sp.t;
      if(age > CHAIN_SPARK_LIFETIME){ chainSparks.splice(i,1); continue; }
      const t = age / CHAIN_SPARK_LIFETIME;
      ctx.globalAlpha = 1 - t;
      ctx.strokeStyle = CHAIN_COLOR;
      ctx.shadowColor = CHAIN_COLOR;
      ctx.shadowBlur = 12;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(sp.x1, sp.y1);
      ctx.lineTo(sp.x2, sp.y2);
      ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.globalAlpha = (1 - t) * 0.8;
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(sp.x1, sp.y1);
      ctx.lineTo(sp.x2, sp.y2);
      ctx.stroke();
    }
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }

  function jellyColor(j, now){
    if(j.type==='bomb') return Math.floor(now/150)%2===0 ? '#ff3355' : '#ffffff';
    if(j.type==='strike') return STRIKE_JELLY_COLOR;
    if(j.type==='blackhole') return 'hsl(' + Math.floor(now*0.15)%360 + ',85%,65%)';
    if(j.type==='grow') return GROW_COLOR;
    return JELLY_COLOR;
  }

  function drawJellies(){
    const now = performance.now();
    ctx.lineWidth = 1.5;
    for(let i=0;i<jellies.length;i++){
      const j = jellies[i];
      const col = jellyColor(j, now);
      ctx.save();
      ctx.translate(j.x, j.y);
      ctx.shadowColor = col;
      ctx.shadowBlur = 13;
      ctx.beginPath();
      ctx.arc(0, 0, j.r, Math.PI, 0);
      ctx.closePath();
      ctx.globalAlpha = 0.55;
      ctx.fillStyle = col;
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.strokeStyle = col;
      ctx.stroke();
      ctx.shadowBlur = 0;
      const hlGrad = ctx.createRadialGradient(-j.r*0.3,-j.r*0.55,0, -j.r*0.3,-j.r*0.55,j.r*0.6);
      hlGrad.addColorStop(0, 'rgba(255,255,255,0.55)');
      hlGrad.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = hlGrad;
      ctx.beginPath();
      ctx.arc(0, 0, j.r, Math.PI, 0);
      ctx.closePath();
      ctx.fill();
      const n = 5;
      for(let t=0;t<n;t++){
        const tx = -j.r*0.7 + (t/(n-1))*j.r*1.4;
        const wob = Math.sin(now*0.004 + t*1.3 + i)*4;
        ctx.strokeStyle = col;
        ctx.beginPath();
        ctx.moveTo(tx, 0);
        ctx.quadraticCurveTo(tx+wob, j.r*0.8, tx+wob*0.5, j.r*1.6);
        ctx.stroke();
      }
      ctx.restore();
    }
    ctx.shadowBlur = 0;
  }

  function drawBlackHole(){
    if(!blackHole) return;
    const now = performance.now();
    ctx.save();
    ctx.translate(blackHole.x, blackHole.y);
    const pulse = 1 + Math.sin(now*0.006)*0.08;
    ctx.beginPath();
    ctx.arc(0, 0, 22*pulse, 0, Math.PI*2);
    ctx.fillStyle = '#0a0014';
    ctx.fill();
    ctx.lineWidth = 2;
    for(let k=0;k<3;k++){
      ctx.beginPath();
      ctx.strokeStyle = 'hsl(' + Math.floor(now*0.2 + k*120)%360 + ',80%,60%)';
      ctx.arc(0, 0, 26+k*7, now*0.002+k, now*0.002+k+4.2);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawFireOrbs(){
    const now = performance.now();
    for(let i=0;i<fireOrbs.length;i++){
      const f = fireOrbs[i];
      const baseColor = f.color || '#ff6a00';
      const flicker = 0.85 + Math.sin(now*0.02 + i)*0.15;
      const r = f.r*flicker;
      ctx.shadowColor = baseColor;
      ctx.shadowBlur = 15*flicker;
      const grad = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, r);
      grad.addColorStop(0, '#fff');
      grad.addColorStop(0.4, baseColor);
      grad.addColorStop(1, shadeColor(baseColor, -35));
      ctx.beginPath();
      ctx.arc(f.x, f.y, r, 0, Math.PI*2);
      ctx.fillStyle = grad;
      ctx.fill();
    }
    ctx.shadowBlur = 0;
  }

  function drawSporeClouds(){
    const now = performance.now();
    for(let i=0;i<sporeClouds.length;i++){
      const s = sporeClouds[i];
      const age = now - s.born;
      const growFrac = Math.min(1, age/600);
      const lifeFrac = Math.max(0, 1 - age/SPORE_CLOUD_LIFETIME);
      const r = SPORE_CLOUD_MAX_R*growFrac;
      if(r <= 0) continue;
      const baseC = s.color || '#6b8a4a';
      const lightC = shadeColor(baseC, 40);
      const flareC = shadeColor(baseC, 65);
      ctx.save();
      ctx.translate(s.x, s.y);
      ctx.globalAlpha = 0.3*lifeFrac;
      const grad = ctx.createRadialGradient(0,0,0, 0,0,r);
      grad.addColorStop(0, lightC);
      grad.addColorStop(0.7, baseC);
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.beginPath();
      ctx.arc(0,0,r,0,Math.PI*2);
      ctx.fillStyle = grad;
      ctx.fill();
      ctx.globalAlpha = 0.45*lifeFrac;
      ctx.fillStyle = flareC;
      for(let p=0;p<6;p++){
        const ang = (p/6)*Math.PI*2 + age*0.001;
        const rad = r*(0.4+0.3*Math.sin(age*0.003+p));
        ctx.beginPath();
        ctx.arc(Math.cos(ang)*rad, Math.sin(ang)*rad, 2.5, 0, Math.PI*2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      ctx.restore();
    }
  }

  function drawShockwaves(){
    const now = performance.now();
    for(let i=shockwaves.length-1;i>=0;i--){
      const sw = shockwaves[i];
      const age = now - sw.t;
      if(age > SHOCK_LIFETIME){ shockwaves.splice(i,1); continue; }
      const t = age / SHOCK_LIFETIME;
      const maxR = sw.big ? 125 : 70;
      ctx.globalAlpha = 1 - t;
      ctx.strokeStyle = sw.color || '#00eaff';
      ctx.shadowColor = sw.color || '#00eaff';
      ctx.shadowBlur = (sw.big ? 24 : 16) * (1-t);
      ctx.lineWidth = sw.big ? 5 : 3;
      ctx.beginPath();
      ctx.arc(sw.x, sw.y, 14 + t*maxR, 0, Math.PI*2);
      ctx.stroke();
    }
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }

  function drawPops(){
    const now = performance.now();
    ctx.textAlign = 'center';
    ctx.font = '600 15px -apple-system, BlinkMacSystemFont, sans-serif';
    for(let i=pops.length-1;i>=0;i--){
      const p = pops[i];
      const age = now - p.t;
      if(age > POP_LIFETIME){ pops.splice(i,1); continue; }
      const t = age / POP_LIFETIME;
      ctx.globalAlpha = 1 - t;
      ctx.strokeStyle = p.color;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 8*(1-t);
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(p.x, p.y, ENEMY_R + t*24, 0, Math.PI*2);
      ctx.stroke();
      ctx.shadowBlur = 6;
      ctx.fillStyle = p.color;
      ctx.fillText(p.text, p.x, p.y - 14 - t*22);
      ctx.shadowBlur = 0;
    }
    ctx.globalAlpha = 1;
  }

  function drawTrail(){
    const now = performance.now();
    ctx.lineCap = 'round';
    for(let i=0;i<trail.length;i++){
      const seg = trail[i];
      const lifeFrac = 1 - Math.min(1, (now-seg.t)/TRAIL_LIFETIME);
      if(lifeFrac <= 0) continue;
      const hue = (185 + (1-lifeFrac)*90) % 360;
      const color = 'hsl(' + hue.toFixed(0) + ',95%,60%)';
      ctx.globalAlpha = lifeFrac * 0.6;
      ctx.strokeStyle = color;
      ctx.shadowColor = color;
      ctx.shadowBlur = 14 * lifeFrac;
      ctx.lineWidth = 2 + 3*lifeFrac;
      ctx.beginPath();
      ctx.moveTo(seg.x1, seg.y1);
      ctx.lineTo(seg.x2, seg.y2);
      ctx.stroke();
      ctx.globalAlpha = lifeFrac * 0.5;
      ctx.shadowBlur = 0;
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = Math.max(0.5, 1*lifeFrac);
      ctx.beginPath();
      ctx.moveTo(seg.x1, seg.y1);
      ctx.lineTo(seg.x2, seg.y2);
      ctx.stroke();
    }
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }

  function drawEnemies(){
    const now = performance.now();
    const lightC = shadeColor(ENEMY_COLOR, 55);
    const darkC = shadeColor(ENEMY_COLOR, -40);
    for(let i=0;i<enemies.length;i++){
      const en = enemies[i];
      if(en.boss){ drawBoss(en); continue; }
      if(en.miniBoss){ drawMiniBoss(en, now); continue; }
      const pulse = 0.82 + 0.18*Math.sin(now*0.006 + i*1.3);
      ctx.shadowColor = ENEMY_COLOR;
      ctx.shadowBlur = 9*pulse;
      const grad = ctx.createRadialGradient(en.x-en.r*0.3, en.y-en.r*0.3, en.r*0.12, en.x, en.y, en.r);
      grad.addColorStop(0, lightC);
      grad.addColorStop(0.55, ENEMY_COLOR);
      grad.addColorStop(1, darkC);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(en.x, en.y, en.r, 0, Math.PI*2);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = '#fff';
      ctx.globalAlpha = 0.45;
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }

  function drawMiniBoss(en, now){
    const wob = en.wobbleSeed || 0;
    if(en.miniType === 'boilback') drawBoilback(en, now, wob);
    else if(en.miniType === 'broodsac') drawBroodSac(en, now, wob);
    else drawTwitcher(en, now, wob);
    // hit-pips above the creature show progress toward crack/destroy
    const pipR = 2.6, gap = 7, startX = en.x - ((en.maxHp-1)*gap)/2;
    for(let p=0;p<en.maxHp;p++){
      ctx.beginPath();
      ctx.arc(startX + p*gap, en.y - en.r - 12, pipR, 0, Math.PI*2);
      ctx.fillStyle = p < en.hp ? '#fff' : 'rgba(255,255,255,0.25)';
      ctx.fill();
    }
  }

  function drawBoilback(en, now, wob){
    const baseColor = en.miniColor;
    const lC = shadeColor(baseColor, 40), dC = shadeColor(baseColor, -45);
    ctx.save();
    ctx.translate(en.x, en.y);
    ctx.shadowColor = baseColor;
    ctx.shadowBlur = 10;
    ctx.beginPath();
    const N = 10;
    for(let k=0;k<=N;k++){
      const ang = (k/N)*Math.PI*2;
      const bump = Math.sin(ang*3 + wob)*0.14 + Math.sin(ang*5 + wob*1.7)*0.06;
      const rad = en.r*(1+bump);
      const px = Math.cos(ang)*rad, py = Math.sin(ang)*rad;
      if(k===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.closePath();
    const grad = ctx.createRadialGradient(-en.r*0.3,-en.r*0.3,en.r*0.1,0,0,en.r);
    grad.addColorStop(0,lC); grad.addColorStop(0.6,baseColor); grad.addColorStop(1,dC);
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#fff'; ctx.globalAlpha = 0.35; ctx.lineWidth = 1; ctx.stroke(); ctx.globalAlpha = 1;
    const boilPos = [[-0.35,-0.2],[0.3,-0.3],[0.1,0.35],[-0.25,0.3]];
    for(let b=0;b<boilPos.length;b++){
      const pulse = 0.7 + 0.3*Math.sin(now*0.004 + b*1.7 + wob);
      ctx.beginPath();
      ctx.arc(boilPos[b][0]*en.r, boilPos[b][1]*en.r, en.r*0.16*pulse, 0, Math.PI*2);
      ctx.fillStyle = dC;
      ctx.fill();
    }
    if(en.cracked){
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.3;
      ctx.beginPath();
      ctx.moveTo(-en.r*0.5,-en.r*0.3); ctx.lineTo(0,0); ctx.lineTo(en.r*0.4,en.r*0.5);
      ctx.moveTo(-en.r*0.1,en.r*0.4); ctx.lineTo(0,0);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawBroodSac(en, now, wob){
    const baseColor = en.miniColor;
    const breathe = 1 + 0.06*Math.sin(now*0.003 + wob);
    ctx.save();
    ctx.translate(en.x, en.y);
    ctx.shadowColor = baseColor; ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.ellipse(0,0,en.r*0.95*breathe,en.r*1.05*breathe,0,0,Math.PI*2);
    const grad = ctx.createRadialGradient(-en.r*0.25,-en.r*0.35,en.r*0.1,0,0,en.r);
    grad.addColorStop(0, shadeColor(baseColor,50));
    grad.addColorStop(0.6, baseColor);
    grad.addColorStop(1, shadeColor(baseColor,-40));
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 0.4;
    ctx.beginPath();
    ctx.ellipse(-en.r*0.3,-en.r*0.35,en.r*0.28,en.r*0.18,-0.5,0,Math.PI*2);
    ctx.fillStyle = '#fff';
    ctx.fill();
    ctx.globalAlpha = 1;
    const budAngles = [0.6,-2.2,2.6];
    for(let b=0;b<budAngles.length;b++){
      const bx = Math.cos(budAngles[b])*en.r*0.85, by = Math.sin(budAngles[b])*en.r*0.85;
      ctx.beginPath();

      ctx.moveTo(-en.r*0.3,-en.r*0.4); ctx.lineTo(en.r*0.1,0); ctx.lineTo(-en.r*0.2,en.r*0.4);
