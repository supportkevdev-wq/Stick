    ctx.restore();
  }

  function drawTwitcher(en, now, wob){
    const baseColor = en.miniColor;
    ctx.save();
    ctx.translate(en.x, en.y);
    ctx.strokeStyle = shadeColor(baseColor,-20);
    ctx.lineWidth = Math.max(1.5, en.r*0.12);
    const legCount = 6;
    for(let l=0;l<legCount;l++){
      const baseAng = (l/legCount)*Math.PI*2;
      const twitch = Math.sin(now*0.02 + l*2.3 + wob)*0.3;
      const lx = Math.cos(baseAng+twitch)*en.r*1.7, ly = Math.sin(baseAng+twitch)*en.r*1.7;
      ctx.beginPath();
      ctx.moveTo(Math.cos(baseAng)*en.r*0.7, Math.sin(baseAng)*en.r*0.7);
      ctx.lineTo(lx,ly);
      ctx.stroke();
    }
    ctx.shadowColor = baseColor; ctx.shadowBlur = 9;
    ctx.beginPath();
    const N = 8;
    for(let k=0;k<=N;k++){
      const ang = (k/N)*Math.PI*2;
      const rad = en.r*(k%2===0 ? 1.1 : 0.85);
      const px = Math.cos(ang)*rad, py = Math.sin(ang)*rad;
      if(k===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.closePath();
    const grad = ctx.createRadialGradient(-en.r*0.2,-en.r*0.2,en.r*0.1,0,0,en.r);
    grad.addColorStop(0, shadeColor(baseColor,45));
    grad.addColorStop(0.6, baseColor);
    grad.addColorStop(1, shadeColor(baseColor,-40));
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(0,0,en.r*0.32,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#1a1a1a';
    ctx.beginPath(); ctx.arc(0,0,en.r*0.15,0,Math.PI*2); ctx.fill();
    if(en.cracked){
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(-en.r*0.4,-en.r*0.2); ctx.lineTo(0,en.r*0.1); ctx.lineTo(en.r*0.3,-en.r*0.3);
      ctx.stroke();
    }
    ctx.restore();
  }

  // the same 14-point jagged crown silhouette used for the monster in the
  // level-30 cutscene, converted from its CSS clip-path into centered,
  // radius-normalized points so the final boss you actually fight matches
  // the "cryptid" reveal exactly, not a random polygon from the 50-shape pool
  const FINAL_BOSS_SHAPE_POINTS = [
    [0,-1], [0.26,-0.72], [0.76,-0.84], [0.56,-0.34], [1.0,0.04], [0.52,0.16],
    [0.44,0.76], [0,0.48], [-0.44,0.76], [-0.52,0.16], [-1.0,0.04], [-0.56,-0.34],
    [-0.76,-0.84], [-0.26,-0.72]
  ];
  function wobblyBlobPath(r, freq, amp, seed){
    ctx.beginPath();
    const N = 12;
    for(let k=0;k<=N;k++){
      const ang = (k/N)*Math.PI*2;
      const bump = Math.sin(ang*freq + seed)*amp + Math.sin(ang*(freq*1.7) + seed*1.3)*amp*0.5;
      const rad = r*(1+bump);
      const px = Math.cos(ang)*rad, py = Math.sin(ang)*rad;
      if(k===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.closePath();
  }
  function fillBossBody(en, lightC, baseColor, darkC){
    ctx.globalAlpha = 0.92;
    const grad = ctx.createRadialGradient(-en.r*0.32,-en.r*0.32,en.r*0.08, 0,0,en.r*1.05);
    grad.addColorStop(0, lightC); grad.addColorStop(0.55, baseColor); grad.addColorStop(1, darkC);
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#fff';
    ctx.stroke();
  }
  // ten gross, distinct bodies, one per dark archetype - replacing the clean
  // polygon/star shapes with something that actually looks like the name.
  function drawVeyrakk(en, baseColor, lightC, darkC, now){
    // half-formed: solid on the right, a broken wireframe with drifting
    // unattached fragments where the rest of him should be
    ctx.beginPath();
    const N = 12;
    for(let k=0;k<=N/2;k++){
      const ang = -Math.PI/2 + (k/(N/2))*Math.PI;
      const bump = Math.sin(ang*3 + en.shapeIndex)*0.1;
      const rad = en.r*(1+bump);
      const px = Math.cos(ang)*rad, py = Math.sin(ang)*rad;
      if(k===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.lineTo(0, en.r*0.3);
    ctx.closePath();
    fillBossBody(en, lightC, baseColor, darkC);
    ctx.strokeStyle = baseColor; ctx.lineWidth = 1.5; ctx.globalAlpha = 0.65;
    for(let f=0;f<3;f++){
      const fx = -en.r*(0.55+f*0.4), fy = Math.sin(now*0.002+f*2)*en.r*0.35;
      ctx.strokeRect(fx-4, fy-4, 8, 8);
    }
    ctx.globalAlpha = 1;
  }
  function drawMorrowbell(en, baseColor, lightC, darkC, now){
    ctx.beginPath();
    ctx.moveTo(0, -en.r);
    ctx.quadraticCurveTo(en.r*0.9, -en.r*0.3, en.r*1.1, en.r*0.7);
    ctx.quadraticCurveTo(en.r*0.6, en.r*0.95, 0, en.r*0.95);
    ctx.quadraticCurveTo(-en.r*0.6, en.r*0.95, -en.r*1.1, en.r*0.7);
    ctx.quadraticCurveTo(-en.r*0.9, -en.r*0.3, 0, -en.r);
    ctx.closePath();
    fillBossBody(en, lightC, baseColor, darkC);
    const swing = Math.sin(now*0.002)*0.35;
    ctx.strokeStyle = darkC; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0,-en.r*0.2); ctx.lineTo(Math.sin(swing)*en.r*0.3, en.r*0.6); ctx.stroke();
    ctx.fillStyle = darkC;
    ctx.beginPath(); ctx.arc(Math.sin(swing)*en.r*0.3, en.r*0.6, en.r*0.12, 0, Math.PI*2); ctx.fill();
  }
  function drawGrinmaw(en, baseColor, lightC, darkC, now){
    wobblyBlobPath(en.r, 3, 0.1, en.shapeIndex);
    fillBossBody(en, lightC, baseColor, darkC);
    ctx.fillStyle = '#1a0508';
    ctx.beginPath();
    ctx.ellipse(0, en.r*0.1, en.r*0.75, en.r*0.32, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    const teethN = 8;
    for(let t=0;t<teethN;t++){
      const tx = -en.r*0.65 + (t/(teethN-1))*en.r*1.3;
      ctx.beginPath();
      ctx.moveTo(tx-4, en.r*0.1-en.r*0.28); ctx.lineTo(tx+4, en.r*0.1-en.r*0.28); ctx.lineTo(tx, en.r*0.1-en.r*0.1);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(tx-4, en.r*0.1+en.r*0.28); ctx.lineTo(tx+4, en.r*0.1+en.r*0.28); ctx.lineTo(tx, en.r*0.1+en.r*0.1);
      ctx.fill();
    }
  }
  function drawBrassmother(en, baseColor, lightC, darkC, now){
    wobblyBlobPath(en.r, 5, 0.04, en.shapeIndex);
    fillBossBody(en, lightC, baseColor, darkC);
    ctx.fillStyle = darkC;
    const hatches = [[-0.4,-0.3],[0.35,-0.25],[0.1,0.4],[-0.3,0.35]];
    for(let h=0;h<hatches.length;h++){
      ctx.save();
      ctx.translate(hatches[h][0]*en.r, hatches[h][1]*en.r);
      ctx.fillRect(-en.r*0.12,-en.r*0.09,en.r*0.24,en.r*0.18);
      ctx.restore();
    }
    ctx.strokeStyle = darkC; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(0,-en.r*0.05,en.r*0.18,0,Math.PI*2); ctx.stroke();
  }
  function drawThornwick(en, baseColor, lightC, darkC, now){
    wobblyBlobPath(en.r, 4, 0.22, en.shapeIndex);
    fillBossBody(en, lightC, baseColor, darkC);
    ctx.strokeStyle = '#e8e2d0'; ctx.lineWidth = 1.5;
    for(let b=0;b<3;b++){
      const ang = b*2.1 + en.shapeIndex;
      ctx.beginPath();
      ctx.moveTo(Math.cos(ang)*en.r*0.5, Math.sin(ang)*en.r*0.5);
      ctx.lineTo(Math.cos(ang+2.3)*en.r*0.6, Math.sin(ang+2.3)*en.r*0.6);
      ctx.stroke();
    }
  }
  function drawCaldrune(en, baseColor, lightC, darkC, now){
    wobblyBlobPath(en.r, 6, 0.08, en.shapeIndex);
    fillBossBody(en, '#3a1a08', baseColor, '#150802');
    const glow = 0.6 + 0.4*Math.sin(now*0.005);
    ctx.strokeStyle = 'hsl(24,100%,' + (50+glow*20).toFixed(0) + '%)';
    ctx.shadowColor = '#ff6a00'; ctx.shadowBlur = 10;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-en.r*0.5,-en.r*0.3); ctx.lineTo(0,0); ctx.lineTo(en.r*0.4,en.r*0.5);
    ctx.moveTo(-en.r*0.2,en.r*0.4); ctx.lineTo(en.r*0.1,-en.r*0.35);
    ctx.stroke();
    ctx.shadowBlur = 0;
  }
  function drawVaska(en, baseColor, lightC, darkC, now){
    ctx.beginPath();
    const N = 12;
    for(let k=0;k<=N;k++){
      const ang = (k/N)*Math.PI*2;
      const droop = (ang>0 && ang<Math.PI) ? Math.sin(ang)*0.25 : 0;
      const bump = Math.sin(ang*3 + en.shapeIndex)*0.1 + droop;
      const rad = en.r*(1+bump);
      const px = Math.cos(ang)*rad, py = Math.sin(ang)*rad;
      if(k===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.closePath();
    fillBossBody(en, lightC, baseColor, darkC);
  }
  function drawRustChoir(en, baseColor, lightC, darkC, now){
    const segAngles = [0, 2.1, 4.2];
    ctx.strokeStyle = darkC; ctx.lineWidth = 2;
    for(let s=0;s<segAngles.length;s++){
      ctx.beginPath();
      ctx.moveTo(0,0);
      ctx.lineTo(Math.cos(segAngles[s])*en.r*0.6, Math.sin(segAngles[s])*en.r*0.6);
      ctx.stroke();
    }
    wobblyBlobPath(en.r*0.7, 5, 0.05, en.shapeIndex);
    fillBossBody(en, lightC, baseColor, darkC);
    for(let s=0;s<segAngles.length;s++){
      const sx = Math.cos(segAngles[s])*en.r*0.6, sy = Math.sin(segAngles[s])*en.r*0.6;
      ctx.save(); ctx.translate(sx,sy);
      ctx.beginPath(); ctx.arc(0,0,en.r*0.3,0,Math.PI*2);
      const g = ctx.createRadialGradient(-en.r*0.1,-en.r*0.1,en.r*0.02,0,0,en.r*0.3);
      g.addColorStop(0,lightC); g.addColorStop(1,darkC);
      ctx.fillStyle = g; ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.globalAlpha = 0.4; ctx.lineWidth = 1; ctx.stroke(); ctx.globalAlpha = 1;
      ctx.restore();
    }
  }
  function drawHushmother(en, baseColor, lightC, darkC, now){
    ctx.beginPath();
    ctx.ellipse(0,0,en.r,en.r*1.02,0,0,Math.PI*2);
    fillBossBody(en, lightC, baseColor, darkC);
    ctx.fillStyle = '#0a0810';
    ctx.beginPath(); ctx.ellipse(0,en.r*0.15,en.r*0.14,en.r*0.2,0,0,Math.PI*2); ctx.fill();
  }
  function drawMoonEater(en, baseColor, lightC, darkC, now){
    ctx.beginPath();
    ctx.arc(0,0,en.r,0,Math.PI*2);
    ctx.arc(en.r*0.55,-en.r*0.15,en.r*0.92,0,Math.PI*2,true);
    fillBossBody(en, lightC, baseColor, darkC);
    ctx.strokeStyle = '#fff'; ctx.globalAlpha = 0.5; ctx.lineWidth = 1.5;
    ctx.shadowColor = baseColor; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.arc(0,0,en.r*0.98,-2.6,0.5); ctx.stroke();
    ctx.shadowBlur = 0; ctx.globalAlpha = 1;
  }
  function drawMushroomMan(en, baseColor, lightC, darkC, now){
    // domed cap up top
    ctx.beginPath();
    ctx.ellipse(0, -en.r*0.15, en.r*1.05, en.r*0.75, 0, Math.PI, 0, false);
    ctx.lineTo(en.r*0.55, en.r*0.1);
    ctx.quadraticCurveTo(0, en.r*0.25, -en.r*0.55, en.r*0.1);
    ctx.closePath();
    fillBossBody(en, lightC, baseColor, darkC);
    // stubby stem below
    ctx.beginPath();
    ctx.moveTo(-en.r*0.32, en.r*0.05);
    ctx.quadraticCurveTo(-en.r*0.28, en.r*0.75, -en.r*0.22, en.r*0.95);
    ctx.lineTo(en.r*0.22, en.r*0.95);
    ctx.quadraticCurveTo(en.r*0.28, en.r*0.75, en.r*0.32, en.r*0.05);
    ctx.closePath();
    ctx.fillStyle = '#e8dcc0';
    ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.globalAlpha = 0.3; ctx.lineWidth = 1; ctx.stroke(); ctx.globalAlpha = 1;
    // toadstool spots on the cap
    ctx.fillStyle = '#8a3a2f';
    const spots = [[-0.4,-0.35,0.13],[0.3,-0.4,0.11],[0.05,-0.15,0.09],[-0.15,-0.5,0.08],[0.5,-0.15,0.09]];
    for(let sp=0;sp<spots.length;sp++){
      ctx.beginPath();
      ctx.arc(spots[sp][0]*en.r, spots[sp][1]*en.r, spots[sp][2]*en.r, 0, Math.PI*2);
      ctx.fill();
    }
  }
  function drawUglyMushroomMan(en, baseColor, lightC, darkC, now){
    // scallop-rimmed cap
    ctx.beginPath();
    ctx.ellipse(0, -en.r*0.15, en.r*1.05, en.r*0.75, 0, Math.PI, 0, false);
    const scallops = 7;
    for(let sc=0;sc<=scallops;sc++){
      const t = sc/scallops;
      const x = en.r*0.55 - t*en.r*1.1;
      const bump = Math.sin(t*Math.PI)*en.r*0.09;
      ctx.quadraticCurveTo(x+en.r*0.08, en.r*0.12+bump, x, en.r*0.09);
    }
    ctx.closePath();
    fillBossBody(en, lightC, baseColor, darkC);

    // gill fan under the cap rim
    ctx.strokeStyle = darkC;
    ctx.lineWidth = 1;
    ctx.globalAlpha = 0.5;
    for(let g=-5;g<=5;g++){
      const ang = (g/5)*1.1;
      ctx.beginPath();
      ctx.moveTo(0, en.r*0.05);
      ctx.lineTo(Math.sin(ang)*en.r*0.5, en.r*0.12+Math.cos(ang)*en.r*0.08);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // stubby stem
    ctx.beginPath();
    ctx.moveTo(-en.r*0.3, en.r*0.05);
    ctx.quadraticCurveTo(-en.r*0.26, en.r*0.7, -en.r*0.2, en.r*0.92);
    ctx.lineTo(en.r*0.2, en.r*0.92);
    ctx.quadraticCurveTo(en.r*0.26, en.r*0.7, en.r*0.3, en.r*0.05);
    ctx.closePath();
    ctx.fillStyle = '#d8cba0';
    ctx.fill();

    // the same five spot colors on every spawn, not randomized
    const spotColors = ['#8a3a2f', '#6b2a1f', '#a8492f', '#5a1f15', '#7a3325'];
    const spotPos = [[-0.4,-0.35,0.13],[0.3,-0.4,0.11],[0.05,-0.15,0.09],[-0.15,-0.5,0.08],[0.5,-0.15,0.09]];
    for(let sp=0;sp<5;sp++){
      ctx.fillStyle = spotColors[sp];
      ctx.beginPath();
      ctx.arc(spotPos[sp][0]*en.r, spotPos[sp][1]*en.r, spotPos[sp][2]*en.r, 0, Math.PI*2);
      ctx.fill();
    }

    // the eye - his weak point - open (glowing amber) or closed (a line)
    const eyeY = -en.r*0.1;
    if(en.eyeOpen){
      ctx.fillStyle = '#3a2a1a';
      ctx.beginPath(); ctx.arc(0, eyeY, en.r*0.16, 0, Math.PI*2); ctx.fill();
      ctx.shadowColor = '#ffb340'; ctx.shadowBlur = 8;
      ctx.fillStyle = '#ffb340';
      ctx.beginPath(); ctx.arc(0, eyeY, en.r*0.1, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#1a1005';
      ctx.beginPath(); ctx.arc(0, eyeY, en.r*0.045, 0, Math.PI*2); ctx.fill();
    } else {
      ctx.strokeStyle = '#3a2a1a';
      ctx.lineWidth = Math.max(1.5, en.r*0.05);
      ctx.beginPath();
      ctx.arc(0, eyeY, en.r*0.16, 0.15*Math.PI, 0.85*Math.PI);
      ctx.stroke();
    }
  }
  function drawArchetypeBody(en, baseColor, lightC, darkC, now){
    switch(en.archetypeName){
      case 'Veyrakk the Unfinished': drawVeyrakk(en, baseColor, lightC, darkC, now); break;
      case 'Morrowbell': drawMorrowbell(en, baseColor, lightC, darkC, now); break;
      case 'Grinmaw': drawGrinmaw(en, baseColor, lightC, darkC, now); break;
      case 'Brassmother': drawBrassmother(en, baseColor, lightC, darkC, now); break;
      case 'Thornwick': drawThornwick(en, baseColor, lightC, darkC, now); break;
      case 'Caldrune': drawCaldrune(en, baseColor, lightC, darkC, now); break;
      case 'Vaska Three-Eyes': drawVaska(en, baseColor, lightC, darkC, now); break;
      case 'The Rust Choir': drawRustChoir(en, baseColor, lightC, darkC, now); break;
      case 'Hushmother': drawHushmother(en, baseColor, lightC, darkC, now); break;
      case 'The Moon Eater': drawMoonEater(en, baseColor, lightC, darkC, now); break;
      case 'Mushroom Man': drawMushroomMan(en, baseColor, lightC, darkC, now); break;
      case 'Ugly Mushroom Man': drawUglyMushroomMan(en, baseColor, lightC, darkC, now); break;
      default:
        wobblyBlobPath(en.r, 4, 0.12, en.shapeIndex||0);
        fillBossBody(en, lightC, baseColor, darkC);
    }
  }
  function drawBossBody(en, shapeDef){
    ctx.beginPath();
    if(en.isFinalBoss){
      for(let k=0;k<FINAL_BOSS_SHAPE_POINTS.length;k++){
        const p = FINAL_BOSS_SHAPE_POINTS[k];
        const px = p[0]*en.r, py = p[1]*en.r;
        if(k===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
      }
    } else if(shapeDef.kind === 'star'){
      const spikes = shapeDef.sides;
      const outerR = en.r, innerR = en.r*shapeDef.innerRatio;
      for(let k=0;k<spikes*2;k++){
        const ang = (k/(spikes*2))*Math.PI*2 + shapeDef.rot;
        const rad = (k%2===0) ? outerR : innerR;
        const px = Math.cos(ang)*rad, py = Math.sin(ang)*rad;
        if(k===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
      }
    } else {
      const sides = shapeDef.sides;
      for(let k=0;k<sides;k++){
        const ang = (k/sides)*Math.PI*2 + shapeDef.rot;
        const px = Math.cos(ang)*en.r, py = Math.sin(ang)*en.r;
        if(k===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
      }
    }
    ctx.closePath();
  }

  function drawBossFace(en){
    const now = performance.now();
    const angry = en.angryUntil && now < en.angryUntil;
    const frac = en.hp / en.maxHp;
    const ex = en.r*0.32, ey = -en.r*0.12;
    const er = Math.max(2, en.r*0.09);
    const col = angry ? '#ff3355' : '#fff';
    const extraEyes = (en.accessory === 'eyes' || en.isFinalBoss) && !angry;
    const driftEyes = en.driftEyes && !angry;

    if(angry){
      ctx.strokeStyle = col;
      ctx.lineWidth = Math.max(1.5, en.r*0.08);
      ctx.beginPath(); ctx.moveTo(-ex-er, ey-er*0.6); ctx.lineTo(-ex+er, ey+er*0.6); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(ex-er, ey+er*0.6); ctx.lineTo(ex+er, ey-er*0.6); ctx.stroke();
    } else if(driftEyes){
      ctx.fillStyle = col;
      for(let p=0;p<3;p++){
        const phase = now*0.0012 + p*2.1;
        const dx = ex*1.3*Math.cos(phase) ;
        const dy = ey + en.r*0.22*Math.sin(phase*1.3 + p);
        ctx.beginPath(); ctx.arc(dx, dy, er*0.9, 0, Math.PI*2); ctx.fill();
      }
    } else if(extraEyes){
      ctx.fillStyle = col;
      const positions = [-ex*1.6, -ex*0.55, ex*0.55, ex*1.6];
      for(let p=0;p<positions.length;p++){
        ctx.beginPath(); ctx.arc(positions[p], ey, er*0.85, 0, Math.PI*2); ctx.fill();
      }
    } else {
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.arc(-ex, ey, er, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(ex, ey, er, 0, Math.PI*2); ctx.fill();
    }

    ctx.strokeStyle = col;
    ctx.lineWidth = Math.max(1.5, en.r*0.06);
    ctx.beginPath();
    if(angry){
      ctx.moveTo(-en.r*0.28, en.r*0.12);
      ctx.lineTo(-en.r*0.1, en.r*0.28);
      ctx.lineTo(0, en.r*0.12);
      ctx.lineTo(en.r*0.1, en.r*0.28);
      ctx.lineTo(en.r*0.28, en.r*0.12);
    } else if(frac > 0.75){
      ctx.arc(0, en.r*0.1, en.r*0.3, 0.2*Math.PI, 0.8*Math.PI); // smile
    } else if(frac > 0.25){
      ctx.moveTo(-en.r*0.22, en.r*0.18);
      ctx.lineTo(-en.r*0.06, en.r*0.14);
      ctx.lineTo(en.r*0.06, en.r*0.14);
      ctx.lineTo(en.r*0.22, en.r*0.18); // wavering, worried
    } else {
      ctx.arc(0, en.r*0.42, en.r*0.3, 1.2*Math.PI, 1.8*Math.PI); // frown
    }
    ctx.stroke();
  }

  function drawBossAccessory(en){
    if(en.accessory === 'crown'){
      ctx.fillStyle = en.color;
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 1;
      const n = 5;
      for(let k=0;k<n;k++){
        const ang = -Math.PI/2 + (k-(n-1)/2)*0.34;
        const tipX = Math.cos(ang)*en.r*1.38, tipY = Math.sin(ang)*en.r*1.38;
        const leftX = Math.cos(ang-0.11)*en.r*0.78, leftY = Math.sin(ang-0.11)*en.r*0.78;
        const rightX = Math.cos(ang+0.11)*en.r*0.78, rightY = Math.sin(ang+0.11)*en.r*0.78;
        ctx.beginPath();
        ctx.moveTo(leftX,leftY);
        ctx.lineTo(tipX,tipY);
        ctx.lineTo(rightX,rightY);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      }
    } else if(en.accessory === 'spikes'){
      ctx.fillStyle = en.color;
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 1;
      const n = 8;
      for(let k=0;k<n;k++){
        const ang = (k/n)*Math.PI*2;
        const perp = ang + Math.PI/2;
        const w = 4;
        const baseX = Math.cos(ang)*en.r*0.88, baseY = Math.sin(ang)*en.r*0.88;
        const tipX = Math.cos(ang)*en.r*1.3, tipY = Math.sin(ang)*en.r*1.3;
        ctx.beginPath();
        ctx.moveTo(baseX+Math.cos(perp)*w, baseY+Math.sin(perp)*w);
        ctx.lineTo(tipX, tipY);
        ctx.lineTo(baseX-Math.cos(perp)*w, baseY-Math.sin(perp)*w);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      }
    }
    // 'eyes' accessory is drawn in drawBossFace; 'none' adds nothing
  }

  function drawForgedGlob(en, baseColor, lightC, darkC, now){
    const bubbles = [
      [0, 0, 1.0], [-0.35, -0.55, 0.55], [0.4, -0.5, 0.5],
      [0.1, -0.85, 0.4], [-0.15, 0.4, 0.6], [0.35, 0.35, 0.45]
    ];
    for(let b=0;b<bubbles.length;b++){
      const bx = bubbles[b][0]*en.r, br = bubbles[b][2]*en.r;
      const wob = Math.sin(now*0.002 + b*1.9)*0.05;
      const by = bubbles[b][1]*en.r*(1+wob);
      ctx.beginPath();
      ctx.arc(bx, by, br, 0, Math.PI*2);
      const grad = ctx.createRadialGradient(bx-br*0.3, by-br*0.3, br*0.1, bx, by, br);
      grad.addColorStop(0, lightC);
      grad.addColorStop(0.6, baseColor);
      grad.addColorStop(1, darkC);
      ctx.fillStyle = grad;
      ctx.fill();
    }
    ctx.globalAlpha = 0.35;
    ctx.fillStyle = '#fff';
    for(let b=0;b<3;b++){
      ctx.beginPath();
      ctx.ellipse(bubbles[b][0]*en.r-en.r*0.15, bubbles[b][1]*en.r-bubbles[b][2]*en.r*0.3, bubbles[b][2]*en.r*0.25, bubbles[b][2]*en.r*0.12, -0.4, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.strokeStyle = darkC;
    ctx.lineWidth = Math.max(2, en.r*0.05);
    for(let d=0;d<4;d++){
      const dx = (-0.5+d*0.33)*en.r;
      const dripLen = en.r*(0.3+0.2*Math.sin(now*0.0015+d*2));
      ctx.beginPath();
      ctx.moveTo(dx, en.r*0.75);
      ctx.quadraticCurveTo(dx+3, en.r*0.75+dripLen*0.6, dx, en.r*0.75+dripLen);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(dx, en.r*0.75+dripLen, en.r*0.05, 0, Math.PI*2);
      ctx.fillStyle = darkC;
      ctx.fill();
    }
    ctx.save();
    ctx.rotate(-0.3);
    const forkX = en.r*1.1, forkLen = en.r*0.9;
    ctx.strokeStyle = '#2a1a12';
    ctx.lineWidth = Math.max(3, en.r*0.07);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(forkX, 0);
    ctx.stroke();
    for(let t=0;t<3;t++){
      const ty = (t-1)*en.r*0.18;
      ctx.beginPath();
      ctx.moveTo(forkX-en.r*0.15, ty*0.4);
      ctx.lineTo(forkX+forkLen*0.5, ty);
      ctx.stroke();
    }
    ctx.restore();
  }
  function drawStickFlowerBoss(en, baseColor, lightC, darkC, now){
    const petalColors = ['#2dd4d4', '#ec4899'];
    const petalCount = 6;
    for(let p=0;p<petalCount;p++){
      const ang = (p/petalCount)*Math.PI*2 - Math.PI/2 + Math.sin(now*0.0008)*0.05;
      ctx.save();
      ctx.rotate(ang);
      ctx.beginPath();
      ctx.ellipse(0, -en.r*0.55, en.r*0.4, en.r*0.65, 0, 0, Math.PI*2);
      const pc = petalColors[p%2];
      const grad = ctx.createRadialGradient(0,-en.r*0.55,en.r*0.1, 0,-en.r*0.55,en.r*0.6);
      grad.addColorStop(0, shadeColor(pc, 35));
      grad.addColorStop(1, shadeColor(pc, -20));
      ctx.fillStyle = grad;
      ctx.fill();
      ctx.strokeStyle = '#ffd166';
      ctx.lineWidth = 2;
      ctx.globalAlpha = 0.6;
      ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.restore();
    }
    // staff held to the side
    ctx.save();
    ctx.rotate(0.5);
    ctx.strokeStyle = '#4a3222';
    ctx.lineWidth = Math.max(2, en.r*0.05);
    ctx.beginPath();
    ctx.moveTo(en.r*0.6, en.r*0.3);
    ctx.lineTo(en.r*1.3, -en.r*0.5);
    ctx.stroke();
    ctx.fillStyle = '#c084fc';
    ctx.shadowColor = '#c084fc';
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(en.r*1.3, -en.r*0.5, en.r*0.14, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.restore();
    // center body backdrop
    ctx.beginPath();
    ctx.arc(0,0,en.r*0.5,0,Math.PI*2);
    const cgrad = ctx.createRadialGradient(-en.r*0.15,-en.r*0.15,en.r*0.05, 0,0,en.r*0.5);
    cgrad.addColorStop(0, '#fff9ec');
    cgrad.addColorStop(1, '#e8c468');
    ctx.fillStyle = cgrad;
    ctx.fill();
    ctx.strokeStyle = '#ffd166';
    ctx.lineWidth = 2;
    ctx.stroke();
    // the big eye - tracks the player, sees what others can't
    const eyeAng = Math.atan2(pivotY-en.y, pivotX-en.x);
    const eyeOffX = Math.cos(eyeAng)*en.r*0.08, eyeOffY = Math.sin(eyeAng)*en.r*0.08;
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.ellipse(0,0,en.r*0.34,en.r*0.24,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#2a9fd4';
    ctx.beginPath(); ctx.arc(eyeOffX,eyeOffY,en.r*0.16,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#0a0a0a';
    ctx.beginPath(); ctx.arc(eyeOffX,eyeOffY,en.r*0.07,0,Math.PI*2); ctx.fill();
  }
  function drawGoodBoy(en, baseColor, lightC, darkC, now){
    // fluffy rounded body
    ctx.beginPath();
    ctx.ellipse(0, en.r*0.15, en.r*0.95, en.r*0.75, 0, 0, Math.PI*2);
    const grad = ctx.createRadialGradient(-en.r*0.3,-en.r*0.1,en.r*0.1, 0,en.r*0.15,en.r*0.95);
    grad.addColorStop(0, lightC);
    grad.addColorStop(0.6, baseColor);
    grad.addColorStop(1, darkC);
    ctx.fillStyle = grad;
    ctx.fill();
    // floppy ears
    ctx.fillStyle = darkC;
    ctx.beginPath(); ctx.ellipse(-en.r*0.75,-en.r*0.15,en.r*0.28,en.r*0.42,-0.3,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(en.r*0.75,-en.r*0.15,en.r*0.28,en.r*0.42,0.3,0,Math.PI*2); ctx.fill();
    // snout
    ctx.fillStyle = lightC;
    ctx.beginPath(); ctx.ellipse(0, en.r*0.35, en.r*0.32, en.r*0.24, 0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#2a1a12';
    ctx.beginPath(); ctx.arc(0, en.r*0.28, en.r*0.06, 0, Math.PI*2); ctx.fill();
    // halo, floating above
    const haloWobble = Math.sin(now*0.003)*0.06;
    ctx.strokeStyle = '#ffe89a';
    ctx.shadowColor = '#ffe89a'; ctx.shadowBlur = 12;
    ctx.lineWidth = Math.max(2, en.r*0.06);
    ctx.beginPath();
    ctx.ellipse(0, -en.r*0.95, en.r*0.4, en.r*(0.12+haloWobble*0.1), 0, 0, Math.PI*2);
    ctx.stroke();
    ctx.shadowBlur = 0;
    // eyes - glow amber normally, gold during rage, soft pink during The Look
    const lookSoft = en.lookState === 'telegraphing';
    const eyeColor = lookSoft ? '#ffb3cc' : (en.chargeState==='charging' ? '#fff200' : '#ffd166');
    ctx.fillStyle = eyeColor;
    ctx.shadowColor = eyeColor; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.arc(-en.r*0.3, en.r*0.02, en.r*0.09, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(en.r*0.3, en.r*0.02, en.r*0.09, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
    // collar with tag
    ctx.strokeStyle = '#5a1a2a';
    ctx.lineWidth = Math.max(3, en.r*0.08);
    ctx.beginPath(); ctx.arc(0, en.r*0.55, en.r*0.5, 0.15*Math.PI, 0.85*Math.PI); ctx.stroke();
    ctx.fillStyle = '#9ad84a';
    ctx.beginPath(); ctx.arc(0, en.r*0.72, en.r*0.09, 0, Math.PI*2); ctx.fill();
    // heart particles during The Look
    if(lookSoft){
      ctx.fillStyle = '#ff6fa8';
      for(let h=0;h<3;h++){
        const hAng = now*0.004 + h*2.1;
        const hx = Math.cos(hAng)*en.r*0.9, hy = -en.r*0.6+Math.sin(now*0.003+h)*en.r*0.2;
        ctx.beginPath();
        ctx.arc(hx-3,hy-3,4,0,Math.PI*2); ctx.arc(hx+3,hy-3,4,0,Math.PI*2);
        ctx.moveTo(hx-6,hy-2); ctx.lineTo(hx,hy+6); ctx.lineTo(hx+6,hy-2);
        ctx.fill();
      }
    }
  }
  function drawBoss(en){
    const now = performance.now();
    const shapeDef = BOSS_SHAPES[en.shapeIndex] || BOSS_SHAPES[0];
    const baseColor = en.color || ENEMY_COLOR;
    const tendrilCount = (en.isForgedGlob||en.isFlowerBoss||en.isGoodBoy) ? 0 : (en.isFinalBoss ? TENDRIL_COUNT + 6 : TENDRIL_COUNT);
    const tendrilReach = en.isFinalBoss ? 2.6 : 1.8;
    const pulse = 0.6 + 0.4*Math.sin(now*0.003 + (en.shapeIndex||0)*0.7);
    ctx.save();
    ctx.translate(en.x, en.y);

    // soft outer aura - every boss glows, the final boss/glob/flower/good boy glow harder
    const auraMult = (en.isFinalBoss||en.isForgedGlob||en.isFlowerBoss||en.isGoodBoy) ? 1.3 : 1.08;
    const auraAlpha = (en.isFinalBoss||en.isForgedGlob||en.isFlowerBoss||en.isGoodBoy ? 0.22 : 0.15) * pulse;
    const auraR = en.r*(auraMult + 0.15*pulse);
    const auraColor = en.isFlowerBoss ? FLOWER_BOSS_AURA_COLOR : (en.isGoodBoy ? GOOD_BOY_AURA_COLOR : baseColor);
    const auraGrad = ctx.createRadialGradient(0,0,en.r*0.75, 0,0,auraR);
    auraGrad.addColorStop(0, hexToRgba(auraColor, auraAlpha));
    auraGrad.addColorStop(1, hexToRgba(auraColor, 0));
    ctx.fillStyle = auraGrad;
    ctx.beginPath();
    ctx.arc(0,0,auraR,0,Math.PI*2);
    ctx.fill();

    ctx.strokeStyle = baseColor;
    ctx.shadowColor = en.isFinalBoss ? FINAL_BOSS_AURA_COLOR : (en.isForgedGlob ? FORGED_GLOB_AURA_COLOR : (en.isFlowerBoss ? FLOWER_BOSS_AURA_COLOR : (en.isGoodBoy ? GOOD_BOY_AURA_COLOR : baseColor)));
    ctx.shadowBlur = (en.isFinalBoss||en.isForgedGlob||en.isFlowerBoss||en.isGoodBoy) ? 16 : 12;
    ctx.lineWidth = en.isFinalBoss ? 4 : 3;
    for(let i=0;i<tendrilCount;i++){
      const baseAngle = (i/tendrilCount)*Math.PI*2;
      const wob = Math.sin(now*0.003 + i*1.7)*0.35;
      const len = en.r*tendrilReach + Math.sin(now*0.002 + i)*6;
      ctx.beginPath();
      ctx.moveTo(Math.cos(baseAngle)*en.r*0.8, Math.sin(baseAngle)*en.r*0.8);
      ctx.quadraticCurveTo(
        Math.cos(baseAngle+wob*0.5)*(en.r+len*0.5), Math.sin(baseAngle+wob*0.5)*(en.r+len*0.5),
        Math.cos(baseAngle+wob)*(en.r+len), Math.sin(baseAngle+wob)*(en.r+len)
      );
      ctx.stroke();
    }
    const lightC = shadeColor(baseColor, 58);
    const darkC = shadeColor(baseColor, -48);
    if(en.isForgedGlob){
      drawForgedGlob(en, baseColor, lightC, darkC, now);
    } else if(en.isFlowerBoss){
      drawStickFlowerBoss(en, baseColor, lightC, darkC, now);
    } else if(en.isGoodBoy){
      drawGoodBoy(en, baseColor, lightC, darkC, now);
    } else if(en.isFinalBoss){
      drawBossBody(en, shapeDef);
      ctx.globalAlpha = 0.92;
      const bodyGrad = ctx.createRadialGradient(-en.r*0.32,-en.r*0.32,en.r*0.08, 0,0,en.r*1.05);
      bodyGrad.addColorStop(0, lightC);
      bodyGrad.addColorStop(0.55, baseColor);
      bodyGrad.addColorStop(1, darkC);
      ctx.fillStyle = bodyGrad;
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#fff';
      ctx.stroke();
    } else {
      drawArchetypeBody(en, baseColor, lightC, darkC, now);
    }
    drawBossAccessory(en);
    if(en.archetypeName !== 'Grinmaw' && en.archetypeName !== 'Hushmother' && en.archetypeName !== 'Ugly Mushroom Man' && !en.isForgedGlob && !en.isFlowerBoss && !en.isGoodBoy){
      drawBossFace(en);
    }
    ctx.shadowBlur = 0;
    ctx.restore();

    const barW = en.r*2.2, barH = 5;
    const hpFrac = Math.max(0, en.hp/en.maxHp);
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.fillRect(en.x-barW/2, en.y-en.r-16, barW, barH);
    ctx.fillStyle = baseColor;
    ctx.fillRect(en.x-barW/2, en.y-en.r-16, barW*hpFrac, barH);
  }

  function drawSpring(){
    if(mode !== 'spring') return;
    ctx.setLineDash([4,4]);
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(springAnchor.x, springAnchor.y);
    ctx.lineTo(pivotX, pivotY);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(springAnchor.x, springAnchor.y, 4, 0, Math.PI*2);
    ctx.stroke();
  }

  function drawPlanets(){
    for(let i=0;i<planets.length;i++){
      const p = planets[i];
      const margin = p.r*1.5;
      let visAlpha = 1;
      if(p.x < margin) visAlpha = Math.max(0, p.x/margin);
      else if(p.x > W-margin) visAlpha = Math.max(0, (W-p.x)/margin);
      if(visAlpha <= 0.01) continue;

      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);

      // soft atmospheric glow behind the body
      ctx.globalAlpha = 0.35*visAlpha;
      ctx.shadowColor = shadeColor(p.def.color, 30);
      ctx.shadowBlur = p.r*0.4;
      ctx.beginPath();
      ctx.arc(0,0,p.r*0.98,0,Math.PI*2);
      ctx.fillStyle = p.def.color;
      ctx.fill();
      ctx.shadowBlur = 0;

      ctx.globalAlpha = 0.55*visAlpha;
      const grad = ctx.createRadialGradient(-p.r*0.3,-p.r*0.3,p.r*0.1, 0,0,p.r);
      grad.addColorStop(0, shadeColor(p.def.color, 35));
      grad.addColorStop(0.65, p.def.color);
      grad.addColorStop(1, shadeColor(p.def.color, -40));
      ctx.beginPath();
      ctx.arc(0,0,p.r,0,Math.PI*2);
      ctx.fillStyle = grad;
      ctx.fill();

      if(p.def.kind === 'bands'){
        ctx.save();
        ctx.beginPath(); ctx.arc(0,0,p.r,0,Math.PI*2); ctx.clip();
        ctx.globalAlpha = 0.32*visAlpha;
        ctx.fillStyle = p.def.accent;
        for(let b=-3;b<=3;b++){
          const by = b*p.r*0.28 + Math.sin(p.seed+b)*p.r*0.04;
          ctx.beginPath();
          ctx.ellipse(0, by, p.r*1.05, p.r*0.11, 0, 0, Math.PI*2);
          ctx.fill();
        }
        ctx.globalAlpha = 0.4*visAlpha;
        ctx.fillStyle = shadeColor(p.def.accent, -30);
        ctx.beginPath();
        ctx.ellipse(p.r*0.25, p.r*0.15, p.r*0.16, p.r*0.09, 0.3, 0, Math.PI*2);
        ctx.fill();
        ctx.restore();
      } else if(p.def.kind === 'ringed'){
        ctx.strokeStyle = p.def.accent;
        ctx.globalAlpha = 0.5*visAlpha;
        ctx.lineWidth = p.r*0.09;
        ctx.beginPath();
        ctx.ellipse(0,0,p.r*1.6, p.r*0.4, 0.3, 0, Math.PI*2);
        ctx.stroke();
        ctx.globalAlpha = 0.3*visAlpha;
        ctx.lineWidth = p.r*0.035;
        ctx.beginPath();
        ctx.ellipse(0,0,p.r*1.3, p.r*0.32, 0.3, 0, Math.PI*2);
        ctx.stroke();
      } else if(p.def.kind === 'cratered'){
        ctx.save();
        ctx.beginPath(); ctx.arc(0,0,p.r,0,Math.PI*2); ctx.clip();
        const craterPos = [[-0.3,-0.2,0.18],[0.25,0.3,0.14],[0.1,-0.35,0.1],[-0.35,0.25,0.12],[0.32,-0.1,0.09],[-0.05,0.05,0.07]];
        for(let c=0;c<craterPos.length;c++){
          ctx.globalAlpha = (c%2===0 ? 0.4 : 0.25)*visAlpha;
          ctx.fillStyle = c%2===0 ? p.def.accent : shadeColor(p.def.accent, 25);
          ctx.beginPath();
          ctx.arc(craterPos[c][0]*p.r, craterPos[c][1]*p.r, craterPos[c][2]*p.r, 0, Math.PI*2);
          ctx.fill();
        }
        ctx.restore();
      } else if(p.def.kind === 'ice'){
        ctx.save();
        ctx.beginPath(); ctx.arc(0,0,p.r,0,Math.PI*2); ctx.clip();
        ctx.globalAlpha = 0.28*visAlpha;
        ctx.strokeStyle = p.def.accent;
        ctx.lineWidth = p.r*0.05;
        ctx.beginPath();
        ctx.arc(p.r*0.3, -p.r*0.2, p.r*0.6, 0.5, 2.5);
        ctx.stroke();
        ctx.globalAlpha = 0.3*visAlpha;
        ctx.fillStyle = p.def.accent;
        ctx.beginPath();
        ctx.ellipse(0, -p.r*0.75, p.r*0.5, p.r*0.22, 0, 0, Math.PI*2);
        ctx.fill();
        ctx.restore();
      }

      // thin sunlit rim-light along one edge
      ctx.globalAlpha = 0.3*visAlpha;
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = Math.max(1, p.r*0.035);
      ctx.beginPath();
      ctx.arc(0,0,p.r*0.99, -1.9, -0.3);
      ctx.stroke();

      ctx.globalAlpha = 1;
      ctx.restore();
    }
  }

  function drawStars(){
    const now = performance.now();
    const scx = W/2, scy = H/2, k = Math.min(W,H)*0.42;
    for(let i=0;i<stars.length;i++){
      const s = stars[i];
      const sx = scx + (s.x/s.z)*k;
      const sy = scy + (s.y/s.z)*k;
      if(sx < 0 || sx > W || sy < 0 || sy > H) continue;
      const twinkle = 0.75 + 0.25*Math.sin(now*0.002 + s.seed);
      const alpha = Math.max(0.12, Math.min(1, 1.15 - s.z)) * twinkle;
      const r = Math.max(0.5, (1.15 - s.z) * 1.8);
      let rgb;
      if(s.colorType === 1) rgb = '255,214,166';
      else if(s.colorType === 2) rgb = '166,214,255';
      else rgb = '255,255,255';
      const color = 'rgba(' + rgb + ',' + alpha.toFixed(2) + ')';
      if(r > 1.3){
        ctx.shadowColor = color;
        ctx.shadowBlur = r*2.2;
      }
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(sx, sy, r, 0, Math.PI*2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }
  }

  function drawShootingStars(){
    const now = performance.now();
    for(let i=0;i<shootingStars.length;i++){
      const ss = shootingStars[i];
      const age = now - ss.born;
      const fade = Math.max(0, 1 - age/ss.life);
      if(fade <= 0) continue;
      const ang = Math.atan2(ss.vy, ss.vx);
      const len = 42;
      const tailX = ss.x - Math.cos(ang)*len, tailY = ss.y - Math.sin(ang)*len;
      const grad = ctx.createLinearGradient(ss.x, ss.y, tailX, tailY);
      grad.addColorStop(0, 'rgba(255,255,255,' + (0.9*fade).toFixed(2) + ')');
      grad.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.strokeStyle = grad;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(ss.x, ss.y);
      ctx.lineTo(tailX, tailY);
      ctx.stroke();
    }
  }

  let lastTime = performance.now();
  function update(){
    const now = performance.now();
    const dt = Math.min(32, now-lastTime);
    lastTime = now;
    if(introActive) return;
    if(powerCutsceneActive) return;
    if(paused) return;
    if(bossDeathPause){
      bossDeathPauseTimer -= dt;
      if(bossDeathPauseTimer <= 0){
        bossDeathPause = false;
        if(level === 10 || level === 20 || level === 30 || level === 31){
          startPowerCutscene();
        } else {
          levelTransitionTitle.textContent = 'LEVEL ' + level;
          levelTransitionEl.style.display = 'flex';
          levelTransition = true;
          sfx.levelUp();
          showLevelBanter();
          setTimeout(()=>{ if(levelTransition) levelPromptEl.style.opacity = '1'; }, 1600);
        }
      }
      return;
    }
    if(levelTransition) return;
    if(gameOver) return;

    let targetWarp = AMBIENT_WARP;

    if(mode==='idle'){
      theta += Math.sin(now*0.0015)*0.0006*dt; // gentle idle wobble
      const dist = Math.hypot(pivotX-cx, pivotY-cy);
      if(dist > 1.5){
        // resting gravity: ease back toward the center of the box
        pivotX = cx + (pivotX-cx)*Math.pow(CENTER_PULL, dt);
        pivotY = cy + (pivotY-cy)*Math.pow(CENTER_PULL, dt);
        targetWarp = -0.0009; // drifting home reads as moving backward
      }
    } else if(mode==='freespin'){
      theta += angularVel*dt;
      angularVel *= Math.pow(FRICTION, dt);
      spinAccum += Math.abs(angularVel*dt);
      if(spinAccum >= Math.PI*2){
        spinAccum -= Math.PI*2;
        addScore(3, 'SPIN x' + (Math.floor(score/3)+1));
      }
      if(Math.abs(angularVel) < 0.0004){ mode='idle'; angularVel=0; }
      targetWarp = AMBIENT_WARP + Math.min(1, Math.abs(angularVel)*40)*0.0008;
    } else if(mode==='thrown'){
      pivotX += vx*dt; pivotY += vy*dt;
      vy += GRAVITY*dt;
      vx *= Math.pow(0.999, dt);
      theta += angularVel*dt;
      angularVel *= Math.pow(AIR_SPIN_DECAY, dt);
      const preBounceSpeed = Math.hypot(vx,vy);
      let bounced = false;
      const restitution = elasticLaunch ? ELASTIC_RESTITUTION : 0.85;
      if(pivotX < MARGIN){ pivotX = MARGIN; vx = Math.abs(vx)*restitution; bounced = true; }
      if(pivotX > W-MARGIN){ pivotX = W-MARGIN; vx = -Math.abs(vx)*restitution; bounced = true; }
      if(pivotY < MARGIN){ pivotY = MARGIN; vy = Math.abs(vy)*restitution; bounced = true; }
      if(pivotY > H-BOTTOM_CLEARANCE){ pivotY = H-BOTTOM_CLEARANCE; vy = -Math.abs(vy)*restitution; bounced = true; }
      if(bounced && preBounceSpeed > SLAM_SPEED_TH){
        triggerSlam(pivotX, pivotY);
        vx *= 0.2; vy *= 0.2; // slam kills most of the remaining motion, less bounce afterward
      }
      if(Math.hypot(vx,vy) < 0.015 && Math.abs(angularVel) < 0.0008){
        mode = 'idle'; angularVel = 0; vx = 0; vy = 0;
      }
      targetWarp = AMBIENT_WARP + Math.min(1.4, Math.hypot(vx,vy))*0.0011;
    } else if(mode==='autostrike'){
      targetWarp = AMBIENT_WARP + 0.002;
      if(!autoStrike || autoStrike.index >= autoStrike.targets.length){
        mode = 'idle'; autoStrike = null;
      } else {
        autoStrike.timer += dt;
        if(autoStrike.timer >= AUTOSTRIKE_HOP_MS){
          const tgt = autoStrike.targets[autoStrike.index];
          const idx = enemies.indexOf(tgt.ref);
          if(idx >= 0){
            const en = enemies[idx];
            pivotX = en.x; pivotY = en.y;
            if(tgt.boss){
              en.hp -= BOSS_CHIP_DAMAGE * bossDamageMult();
              en.lastHit = performance.now();
              checkBossRingAttack(en);
              if(en.hp <= 0){
                enemies.splice(idx,1);
                killBoss(en);
              } else {
                spawnPop(en.x, en.y, '+' + BOSS_HIT_SCORE, STRIKE_JELLY_COLOR);
                addScore(BOSS_HIT_SCORE, 'BOSS HIT');
                addHealth(HEALTH_BOSS_HIT);
                en.angryUntil = Math.max(en.angryUntil, performance.now() + BOSS_HIT_ANGRY_MS);
              }
            } else {
              const s = Math.floor(rand(MOB_SCORE_MIN, MOB_SCORE_MAX+1));
              spawnPop(en.x, en.y, '+' + s, STRIKE_JELLY_COLOR);
              enemies.splice(idx,1);
              addScore(s, 'HIT');
              startChain(en.x, en.y);
            }
          }
          autoStrike.index++;
          autoStrike.timer = 0;
        }
      }
    }

    // record the stick's current position/angle for the fading trail behind it
    const seg = stickWorldSegment();
    trail.push({x1:seg.x1, y1:seg.y1, x2:seg.x2, y2:seg.y2, t:now});
    while(trail.length && now - trail[0].t > TRAIL_LIFETIME) trail.shift();

    currentWarp += (targetWarp - currentWarp) * Math.min(1, dt*0.004);
    stickScale += (targetStickScale - stickScale) * Math.min(1, dt*0.003);
    for(let i=0;i<stars.length;i++){
      const s = stars[i];
      s.z -= currentWarp*dt;
      if(s.z <= 0.05){ s.z = 1; s.x = rand(-1,1); s.y = rand(-1,1); }
      else if(s.z >= 1.15){ s.z = 0.15; s.x = rand(-1,1); s.y = rand(-1,1); }
    }

    planetTimer -= dt;
    if(planetTimer <= 0 && planets.length < PLANET_MAX_ONSCREEN){
      spawnPlanet();
      planetTimer = rand(PLANET_MIN_INTERVAL, PLANET_MAX_INTERVAL);
    }
    for(let i=planets.length-1;i>=0;i--){
      const p = planets[i];
      p.x += p.vx*dt; p.y += p.vy*dt;
      p.rot += p.rotSpeed*dt;
      if(p.x < -p.r*2.5-50 || p.x > W+p.r*2.5+50){
        planets.splice(i,1);
      }
    }

    shootingStarTimer -= dt;
    if(shootingStarTimer <= 0){
      spawnShootingStar();
      shootingStarTimer = rand(7000,16000);
    }
    for(let i=shootingStars.length-1;i>=0;i--){
      const ss = shootingStars[i];
      ss.x += ss.vx*dt; ss.y += ss.vy*dt;
      if(now - ss.born > ss.life) shootingStars.splice(i,1);
    }

    gameTime += dt;
    if(!enemiesUnlocked && gameTime >= ENEMY_TIME_THRESHOLD){
      enemiesUnlocked = true;
      showCombo('ENEMIES');
    }
    if(bossCooldown > 0) bossCooldown -= dt;
    if(!bossUnlocked && bossCooldown <= 0 && score >= BOSS_THRESHOLD*level){
      bossUnlocked = true;
      bossActive = true;
      restartMusicLoop();
      targetStickScale = STICK_BOSS_SCALE;
      wrap.classList.add('boss-mode');
      currentBossesRequired = rollBossesRequired(level);
      showCombo(currentBossesRequired > 1 ? (currentBossesRequired + 'x BOSSES') : 'BOSS');
      spawnBossGroup(currentBossesRequired);
    }
    if(enemiesUnlocked){
      const maxEnemiesNow = Math.min(20, Math.round((MAX_ENEMIES + (scalingLevel()-1)*2) * diffTier().spawnMult));
      enemySpawnTimer -= dt;
      if(enemySpawnTimer <= 0 && enemies.length < maxEnemiesNow){
        spawnEnemy();
        const shrink = Math.max(0.35, 1-(scalingLevel()-1)*0.08) / diffTier().spawnMult;
        enemySpawnTimer = rand(400*shrink, 850*shrink);
      }
      mobTimer -= dt;
      if(mobTimer <= 0){
        triggerMob();
        mobTimer = rand(MOB_MIN_INTERVAL, MOB_MAX_INTERVAL);
      }
      if(!bossActive){
        miniBossTimer -= dt;
        if(miniBossTimer <= 0 && enemies.filter(e=>e.miniBoss).length < miniBossMaxOnscreen()){
          spawnMiniBoss();
          const mbShrink = Math.max(0.6, 1-(scalingLevel()-1)*0.04);
          miniBossTimer = rand(MINI_BOSS_MIN_INTERVAL*mbShrink, MINI_BOSS_MAX_INTERVAL*mbShrink);
        }
      }
      banterTimer -= dt;
      if(banterTimer <= 0){
        showBanterLine();
        banterTimer = rand(14000, 24000);
      }
    }
    for(let i=0;i<enemies.length;i++){
      const en = enemies[i];
      if(en.miniType === 'twitcher'){
        en.dashTimer -= dt;
        if(en.dashTimer <= 0){
          const ang = rand(0, Math.PI*2), spd = rand(0.06,0.1);
          en.vx = Math.cos(ang)*spd; en.vy = Math.sin(ang)*spd;
          en.dashTimer = rand(400,900);
        }
      }
      en.x += en.vx*dt; en.y += en.vy*dt;
      const m = Math.max(MARGIN, en.r+4);
      if(en.x < m){ en.x = m; en.vx = Math.abs(en.vx); }
      if(en.x > W-m){ en.x = W-m; en.vx = -Math.abs(en.vx); }
      if(en.y < m){ en.y = m; en.vy = Math.abs(en.vy); }
      if(en.y > H-m){ en.y = H-m; en.vy = -Math.abs(en.vy); }
    }
    if(enemies.length){
      const twinActive = level >= FINAL_BOSS_LEVEL;
      const echoSeg = twinActive ? echoStickWorldSegment() : null;
      for(let i=enemies.length-1;i>=0;i--){
        const en = enemies[i];
        const dMain = distToSegment(en.x,en.y, seg.x1,seg.y1,seg.x2,seg.y2);
        const dEcho = twinActive ? distToSegment(en.x,en.y, echoSeg.x1,echoSeg.y1,echoSeg.x2,echoSeg.y2) : Infinity;
        if(Math.min(dMain, dEcho) < en.r+5){
          if(en.boss){
            if(en.weakEye && !en.eyeOpen){
              if(now - (en.lastShieldPop||0) > 300){
                en.lastShieldPop = now;
                spawnPop(en.x, en.y, 'SHIELDED', '#8a8a8a');
              }
              continue;
            }
            if(en.untargetableUntil && now < en.untargetableUntil){
              if(now - (en.lastShieldPop||0) > 300){
                en.lastShieldPop = now;
                spawnPop(en.x, en.y, 'UNTARGETABLE', '#2dd4d4');
              }
              continue;
            }
            if(now - en.lastHit < BOSS_HIT_COOLDOWN) continue;
            en.lastHit = now;
            const weakBonus = (en.weakEye && en.eyeOpen) ? 2 : 1;
            en.hp -= 1*bossDamageMult()*weakBonus;
            checkBossRingAttack(en);
            if(en.hp <= 0){
              enemies.splice(i,1);
              killBoss(en);
            } else {
              spawnPop(en.x, en.y, '+' + (BOSS_HIT_SCORE*weakBonus));
              addScore(BOSS_HIT_SCORE*weakBonus, 'BOSS HIT');
              addHealth(HEALTH_BOSS_HIT);
              en.angryUntil = Math.max(en.angryUntil, performance.now() + BOSS_HIT_ANGRY_MS);
            }
          } else if(en.miniBoss){
            en.hp -= 1*bossDamageMult();
            if(en.hp > 0){
              if(en.hp <= 1 && !en.cracked){
                en.cracked = true;
                triggerMiniBossCrack(en);
              } else {
                spawnPop(en.x, en.y, 'HIT', en.miniColor);
              }
            } else {
              const s = Math.floor(rand(MOB_SCORE_MIN, MOB_SCORE_MAX+1)) * 3;
              spawnPop(en.x, en.y, '+' + s, en.miniColor);
              enemies.splice(i,1);
              addScore(s, 'MINI BOSS DOWN');
              addHealth(HEALTH_HIT*2);
              startChain(en.x, en.y);
              triggerMiniBossDestroy(en);
              if(en.miniType === 'broodsac'){
                for(let k=0;k<2;k++) spawnEnemy();
              }
            }
          } else {
            const s = Math.floor(rand(MOB_SCORE_MIN, MOB_SCORE_MAX+1));
            spawnPop(en.x, en.y, '+' + s);
            enemies.splice(i,1);
            addScore(s, 'HIT');
            addHealth(HEALTH_HIT);
            startChain(en.x, en.y);
          }
        }
      }
    }

    if(enemiesUnlocked){
      addHealth(-CONSTANT_DRAIN * diffMult() * (dt/1000));
      if(enemies.length){
        const drainCount = Math.min(enemies.length, DRAIN_CAP_COUNT);
        addHealth(-DRAIN_PER_ENEMY * drainCount * diffMult() * (dt/1000));
        if(bossActive) addHealth(-BOSS_DRAIN_EXTRA * diffMult() * (dt/1000));
        if(bossActive){
          let totalAura = 0;
          for(let i=0;i<enemies.length;i++){ if(enemies[i].boss && enemies[i].auraDrain) totalAura += enemies[i].auraDrain; }
          if(totalAura > 0) addHealth(-totalAura * diffMult() * (dt/1000));
        }
      }
    }

    // each boss fires independently, and archetype behaviors run per-boss
    let moonEaterFrac = 0;
    const mobCountNow = enemies.filter(e=>!e.boss).length;
    for(let i=0;i<enemies.length;i++){
      const en = enemies[i];
      if(!en.boss) continue;
      en.fireTimer -= dt;
      if(en.fireTimer <= 0){
        spawnFireOrb(en);
        const shrink = Math.max(0.4, 1-(scalingLevel()-1)*0.07) * en.fireMult / diffTier().fireRateMult;
        en.fireTimer = rand(FIRE_MIN_INTERVAL*shrink, FIRE_MAX_INTERVAL*shrink);
      }
      if(en.regenHp && en.hp < en.maxHp){
        en.hp = Math.min(en.maxHp, en.hp + en.regenHp*diffMult()*(dt/1000));
      }
      if(en.spawnsMobs){
        en.mobSpawnTimer -= dt;
        if(en.mobSpawnTimer <= 0 && enemies.length < MOB_HARD_CAP){
          spawnEnemy();
          en.mobSpawnTimer = rand(4000,7000);
        }
      }
      if(en.healsFromMobs && mobCountNow > 0){
        en.hp = Math.min(en.maxHp, en.hp + 0.6*diffMult()*(dt/1000));
      }
      if(en.darkensScreen){
        moonEaterFrac = Math.max(moonEaterFrac, 1 - (en.hp/en.maxHp));
      }
      if(en.releasesSpores){
        en.sporeTimer -= dt;
        if(en.sporeTimer <= 0){
          spawnSporeCloud(en.x, en.y);
          en.sporeTimer = rand(3500,5500);
        }
      }
      if(en.weakEye){
        en.eyeTimer -= dt;
        if(en.eyeTimer <= 0){
          en.eyeOpen = !en.eyeOpen;
          if(en.eyeOpen){
            en.eyeTimer = 900;
            showCombo('WEAK POINT');
          } else {
            en.eyeTimer = rand(1800,2800);
          }
        }
      }
      if(en.growsOverTime){
        const growCap = en.baseR * 1.35;
        if(en.r < growCap) en.r = Math.min(growCap, en.r + 0.0025*dt);
      }
      if(en.splattersHazard){
        en.splatterTimer -= dt;
        if(en.splatterTimer <= 0){
          spawnSporeCloud(en.x, en.y, FORGED_GLOB_COLOR);
          en.splatterTimer = rand(2200,3400);
        }
      }
      if(en.floodsAtLowHp && !en.floodTriggered && en.hp/en.maxHp <= 0.25){
        en.floodTriggered = true;
        showCombo('THE FLOOD');
        triggerShake(10);
        for(let k=0;k<5;k++){
          spawnSporeCloud(rand(MARGIN+40,W-MARGIN-40), rand(MARGIN+40,H*0.7), FORGED_GLOB_COLOR);
        }
      }
      if(en.chargesAtPlayer){
        if(en.chargeState === 'idle'){
          en.chargeTimer -= dt;
          if(en.chargeTimer <= 0){
            en.chargeState = 'winding';
            en.chargeTimer = 500;
            en.vx = 0; en.vy = 0;
            showCombo('FORK LUNGE');
            triggerShake(4);
          }
        } else if(en.chargeState === 'winding'){
          en.chargeTimer -= dt;
          if(en.chargeTimer <= 0){
            const ang = Math.atan2(pivotY-en.y, pivotX-en.x);
            en.chargeDX = Math.cos(ang); en.chargeDY = Math.sin(ang);
            en.chargeState = 'charging';
            en.chargeTimer = 650;
          }
        } else if(en.chargeState === 'charging'){
          en.x += en.chargeDX*0.22*dt;
          en.y += en.chargeDY*0.22*dt;
          en.chargeTimer -= dt;
          const hitEdge = en.x<MARGIN+en.r || en.x>W-MARGIN-en.r || en.y<MARGIN+en.r || en.y>H-MARGIN-en.r;
          if(en.chargeTimer <= 0 || hitEdge){
            en.chargeState = 'idle';
            en.chargeTimer = rand(4500,6500);
            en.x = Math.max(MARGIN+en.r, Math.min(W-MARGIN-en.r, en.x));
            en.y = Math.max(MARGIN+en.r, Math.min(H-MARGIN-en.r, en.y));
            const ang2 = rand(0,Math.PI*2);
            en.vx = Math.cos(ang2)*0.012; en.vy = Math.sin(ang2)*0.012;
          }
          if(distToSegment(en.x,en.y, seg.x1,seg.y1,seg.x2,seg.y2) < en.r+5 && now >= hitInvulnUntil){
            hitInvulnUntil = now + HIT_INVULN_MS;
            const chargeDmg = en.isGoodBoy ? 12 : 14;
            const chargeColor = en.isGoodBoy ? '#e8b866' : '#ff7a1a';
            const chargeLabel = en.isGoodBoy ? 'BOWLED OVER' : 'IMPALED';
            addHealth(-chargeDmg);
            spawnPop(pivotX, pivotY, '-' + chargeDmg, chargeColor);
            showCombo(chargeLabel);
            triggerShake(6);
          }
        }
      }
      if(en.bloomBlast){
        en.bloomTimer -= dt;
        if(en.bloomTimer <= 0){
          triggerBossRing(en);
          en.hp = Math.min(en.maxHp, en.hp + en.maxHp*0.05);
          showCombo('BLOOM BLAST');
          en.bloomTimer = rand(5500,7500);
        }
      }
      if(en.rootBind){
        en.rootTimer -= dt;
        if(en.rootTimer <= 0){
          spawnSporeCloud(pivotX + rand(-40,40), pivotY + rand(-40,40), '#3a9a4a');
          showCombo('ROOT BIND');
          en.rootTimer = rand(4500,6500);
        }
      }
      if(en.healsSelf){
        en.healTimer -= dt;
        if(en.healTimer <= 0){
          en.hp = Math.min(en.maxHp, en.hp + en.maxHp*0.12);
          spawnPop(en.x, en.y-en.r, 'HEALING LIGHT', '#ff9ecb');
          showCombo('HEALING LIGHT');
          en.healTimer = rand(6500,8500);
        }
      }
      if(en.dashesAway){
        en.dashTimer -= dt;
        if(en.dashTimer <= 0){
          const dashAng = rand(0,Math.PI*2);
          const dashDist = rand(80,160);
          en.x = Math.max(MARGIN+en.r, Math.min(W-MARGIN-en.r, en.x+Math.cos(dashAng)*dashDist));
          en.y = Math.max(MARGIN+en.r, Math.min(H*0.55, en.y+Math.sin(dashAng)*dashDist));
          en.untargetableUntil = now + 550;
          showCombo('PETAL DASH');
          en.dashTimer = rand(4000,6000);
        }
      }
      if(en.healsWhenClose){
        const distToPlayer = Math.hypot(pivotX-en.x, pivotY-en.y);
        if(distToPlayer < en.r*2.5){
          en.hp = Math.min(en.maxHp, en.hp + 0.08*en.maxHp*(dt/1000));
        }
      }
      if(en.givesTheLook){
        if(en.lookState === 'idle'){
          en.lookTimer -= dt;
          if(en.lookTimer <= 0){
            en.lookState = 'telegraphing';
            en.lookTimer = 700;
            showCombo('THE LOOK');
          }
        } else if(en.lookState === 'telegraphing'){
          en.lookTimer -= dt;
          if(en.lookTimer <= 0){
            en.lookState = 'idle';
            en.lookTimer = rand(5500,8000);
            for(let k=0;k<8;k++){
              const ang = (k/8)*Math.PI*2;
              fireOrbs.push({
                x: en.x, y: en.y,
                vx: Math.cos(ang)*FIRE_SPEED*1.3, vy: Math.sin(ang)*FIRE_SPEED*1.3,
                r: FIRE_R, dmgMult: 1.1, color: '#ff6fa8'
              });
            }
            showCombo('GOTCHA');
            triggerShake(6);
          }
        }
      }
      if(en.ballTornado){
        en.ballTimer -= dt;
        if(en.ballTimer <= 0){
          const ballCount = 12;
          for(let k=0;k<ballCount;k++){
            const ang = (k/ballCount)*Math.PI*2;
            fireOrbs.push({
              x: en.x, y: en.y,
              vx: Math.cos(ang)*FIRE_SPEED*0.9, vy: Math.sin(ang)*FIRE_SPEED*0.9,
              r: FIRE_R*0.85, dmgMult: 0.8, color: '#d4e04a'
            });
          }
          showCombo('TENNIS BALL TORNADO');
          triggerShake(5);
          en.ballTimer = rand(5000,7000);
        }
      }
    }
    updateDebris(dt, now);
    updateMotes(dt);
    bossTintExtra += (moonEaterFrac*0.45 - bossTintExtra) * Math.min(1, dt*0.003);

    // dynamic master filter: as health drops into the critical zone the whole
    // mix progressively muffles, then opens back up as you recover
    if(masterLowpass){
      let targetFreq = 20000;
      if(health <= VIGNETTE_START){
        const severity = Math.min(1, (VIGNETTE_START-health)/(VIGNETTE_START-HEALTH_MIN));
        targetFreq = 20000 - severity*18400;
      }
      const cur = masterLowpass.frequency.value;
      masterLowpass.frequency.value = cur + (targetFreq-cur)*Math.min(1, dt*0.002);
    }
    for(let i=fireOrbs.length-1;i>=0;i--){
      const f = fireOrbs[i];
      f.x += f.vx*dt; f.y += f.vy*dt;
      if(f.x < -20 || f.x > W+20 || f.y < -20 || f.y > H+20){
        fireOrbs.splice(i,1);
        continue;
      }
      if(distToSegment(f.x,f.y, seg.x1,seg.y1,seg.x2,seg.y2) < f.r+5){
        fireOrbs.splice(i,1);
        if(now >= hitInvulnUntil){
          hitInvulnUntil = now + HIT_INVULN_MS;
          const dmg = Math.round(FIRE_DAMAGE * (f.dmgMult||1));
          addHealth(-dmg);
          spawnPop(f.x, f.y, '-' + dmg);
          showCombo('BURNED');
          triggerShake(4);
        }
      }
    }

    for(let i=sporeClouds.length-1;i>=0;i--){
      const s = sporeClouds[i];
      const age = now - s.born;
      if(age > SPORE_CLOUD_LIFETIME){ sporeClouds.splice(i,1); continue; }
      const growFrac = Math.min(1, age/600);
      const r = SPORE_CLOUD_MAX_R*growFrac;
      if(distToSegment(s.x,s.y, seg.x1,seg.y1,seg.x2,seg.y2) < r && now >= hitInvulnUntil){
        hitInvulnUntil = now + HIT_INVULN_MS;
        addHealth(-SPORE_TICK_DAMAGE);
        spawnPop(s.x, s.y, '-' + SPORE_TICK_DAMAGE, '#9fc77a');
        showCombo('SPORED');
        triggerShake(3);
      }
    }

    if(enemiesUnlocked){
      mobShotTimer -= dt;
      if(mobShotTimer <= 0){
        spawnMobShot();
        const shrink = Math.max(0.4, 1-(scalingLevel()-1)*0.06) / diffTier().fireRateMult;
        mobShotTimer = rand(MOB_SHOT_MIN_INTERVAL*shrink, MOB_SHOT_MAX_INTERVAL*shrink);
      }
    }
    for(let i=mobShots.length-1;i>=0;i--){
      const ms = mobShots[i];
      ms.x += ms.vx*dt; ms.y += ms.vy*dt;
      if(ms.x < -20 || ms.x > W+20 || ms.y < -20 || ms.y > H+20){
        mobShots.splice(i,1);
        continue;
      }
      if(distToSegment(ms.x,ms.y, seg.x1,seg.y1,seg.x2,seg.y2) < ms.r+5){
        mobShots.splice(i,1);
        if(now >= hitInvulnUntil){
          hitInvulnUntil = now + HIT_INVULN_MS;
          addHealth(-MOB_SHOT_DAMAGE);
          spawnPop(ms.x, ms.y, '-' + MOB_SHOT_DAMAGE);
          showCombo('ZAPPED');
          triggerShake(3);
        }
      }
    }

    if(level >= MAGIC_ORB_LEVEL && mode !== 'idle'){
      magicOrbTimer -= dt;
      if(magicOrbTimer <= 0){
        spawnMagicOrb();
        magicOrbTimer = rand(MAGIC_ORB_INTERVAL_MIN, MAGIC_ORB_INTERVAL_MAX);
      }
    }
    for(let i=magicOrbs.length-1;i>=0;i--){
      const o = magicOrbs[i];
      const age = now - o.born;
      if(age < MAGIC_ORB_SPIRAL_DURATION){
        // opening flourish: spiral outward from the crystal
        const curAng = Math.atan2(o.vy, o.vx);
        const curSpeed = Math.hypot(o.vx, o.vy);
        const nextAng = curAng + MAGIC_ORB_SPIRAL_RATE*dt;
        o.vx = Math.cos(nextAng)*curSpeed;
        o.vy = Math.sin(nextAng)*curSpeed;
      } else {
        // seeking flight: home in on the nearest living target, re-targeting as needed
        if(!o.target || !enemies.includes(o.target)){
          let best = null, bestD = Infinity;
          for(let j=0;j<enemies.length;j++){
            const en = enemies[j];
            const d = Math.hypot(en.x-o.x, en.y-o.y);
            if(d < bestD){ bestD = d; best = en; }
          }
          o.target = best;
        }
        if(o.target){
          const desiredAng = Math.atan2(o.target.y-o.y, o.target.x-o.x);
          const curAng = Math.atan2(o.vy, o.vx);
          let diff = desiredAng - curAng;
          while(diff > Math.PI) diff -= Math.PI*2;
          while(diff < -Math.PI) diff += Math.PI*2;
          const maxTurn = MAGIC_ORB_SEEK_TURN*dt;
          const turn = Math.max(-maxTurn, Math.min(maxTurn, diff));
          const newAng = curAng + turn;
          const speed = Math.min(MAGIC_ORB_SPEED*1.6, Math.hypot(o.vx,o.vy)*(1+dt*0.0006));
          o.vx = Math.cos(newAng)*speed;
          o.vy = Math.sin(newAng)*speed;
        } else {
          const curAng = Math.atan2(o.vy, o.vx);
          const curSpeed = Math.hypot(o.vx, o.vy);
          const nextAng = curAng + MAGIC_ORB_SPIRAL_RATE*0.6*dt;
          o.vx = Math.cos(nextAng)*curSpeed;
          o.vy = Math.sin(nextAng)*curSpeed;
        }
      }
      o.x += o.vx*dt; o.y += o.vy*dt;
      o.trail.push({x:o.x, y:o.y});
      if(o.trail.length > MAGIC_ORB_TRAIL_LEN) o.trail.shift();
      if(now - o.born > MAGIC_ORB_MAX_AGE || o.x<-30 || o.x>W+30 || o.y<-30 || o.y>H+30){
        magicOrbs.splice(i,1);
        continue;
      }
      for(let j=enemies.length-1;j>=0;j--){
        const en = enemies[j];
        if(Math.hypot(en.x-o.x, en.y-o.y) >= MAGIC_ORB_R + en.r) continue;
        if(en.boss){
          if(now - en.lastHit < BOSS_HIT_COOLDOWN) continue;
          en.lastHit = now;
          en.hp -= MAGIC_ORB_DAMAGE_BOSS * bossDamageMult();
          checkBossRingAttack(en);
          if(en.hp <= 0){
            enemies.splice(j,1);
            killBoss(en);
          } else {
            spawnPop(en.x, en.y, '+' + BOSS_HIT_SCORE, MAGIC_ORB_COLOR);
            addScore(BOSS_HIT_SCORE, 'BOSS HIT');
            addHealth(HEALTH_BOSS_HIT);
            en.angryUntil = Math.max(en.angryUntil, performance.now() + BOSS_HIT_ANGRY_MS);
          }
        } else {
          const s = Math.floor(rand(MOB_SCORE_MIN, MOB_SCORE_MAX+1));
          spawnPop(en.x, en.y, '+' + s, MAGIC_ORB_COLOR);
          enemies.splice(j,1);
          addScore(s, 'HIT');
          addHealth(HEALTH_HIT);
          startChain(en.x, en.y);
        }
        magicOrbs.splice(i,1);
        break;
      }
    }

    if(blackHole){
      blackHole.timer -= dt;
      for(let i=enemies.length-1;i>=0;i--){
        const en = enemies[i];
        if(en.boss) continue;
        const dx = blackHole.x-en.x, dy = blackHole.y-en.y;
        const d = Math.hypot(dx,dy) || 1;
        en.x += (dx/d)*BLACKHOLE_PULL*dt;
        en.y += (dy/d)*BLACKHOLE_PULL*dt;
        if(d < BLACKHOLE_EAT_R){
          const s = Math.floor(rand(MOB_SCORE_MIN, MOB_SCORE_MAX+1));
          spawnPop(en.x, en.y, '+' + s, '#c792ea');
          enemies.splice(i,1);
          addScore(s, 'HIT');
          startChain(en.x, en.y);
        }
      }
      if(blackHole.timer <= 0) blackHole = null;
    }

    if(growTimer > 0){
      growTimer -= dt;
      if(growTimer <= 0){
        targetStickScale = bossActive ? STICK_BOSS_SCALE : STICK_NORMAL_SCALE;
      }
    }

    jellyTimer -= dt;
    if(jellyTimer <= 0){
      spawnJelly();
      jellyTimer = rand(JELLY_MIN_INTERVAL, JELLY_MAX_INTERVAL);
    }
    for(let i=jellies.length-1;i>=0;i--){
      const j = jellies[i];
      j.x += j.vx*dt; j.y += j.vy*dt;
      if(j.x < -60 || j.x > W+60 || j.y < -60 || j.y > H+60){
        jellies.splice(i,1);
        continue;
      }
      if(distToSegment(j.x,j.y, seg.x1,seg.y1,seg.x2,seg.y2) < j.r+5){
        jellies.splice(i,1);
        if(j.type==='bomb'){
          triggerBombClear(j.x, j.y);
        } else if(j.type==='strike'){
          triggerAutoStrike();
        } else if(j.type==='blackhole'){
          triggerBlackHole(j.x, j.y);
        } else if(j.type==='grow'){
          triggerGrowBoost(j.x, j.y);
        } else {
          const healAmt = level >= 10 ? Math.round(JELLY_HEAL*1.5) : JELLY_HEAL;
          addHealth(healAmt);
          addScore(JELLY_SCORE, 'JELLY');
          spawnPop(j.x, j.y, '+' + healAmt + ' HP', JELLY_COLOR);
        }
      }
    }

    if(chainQueue.length){
      for(let ci=chainQueue.length-1;ci>=0;ci--){
        const c = chainQueue[ci];
        if(now < c.t) continue;
        chainQueue.splice(ci,1);
        for(let j=enemies.length-1;j>=0;j--){
          const en = enemies[j];
          if(en.boss) continue;
          if(Math.hypot(en.x-c.x, en.y-c.y) < CHAIN_RADIUS){
            const s = Math.floor(rand(MOB_SCORE_MIN, MOB_SCORE_MAX+1));
            chainSparks.push({x1:c.x, y1:c.y, x2:en.x, y2:en.y, t:now});
            spawnPop(en.x, en.y, '+' + s, CHAIN_COLOR);
            enemies.splice(j,1);
            addScore(s, 'CHAIN');
            addHealth(HEALTH_HIT);
            chainQueue.push({x:en.x, y:en.y, t: now + CHAIN_DELAY});
          }
        }
      }
    }

    shakeMag *= Math.pow(SHAKE_DECAY, dt);
    if(streakTimer > 0){
      streakTimer -= dt;
      if(streakTimer <= 0){
        streak = 0;
        streakEl.style.opacity = '0';
      }
    }

    if(health <= HEALTH_MIN){
      triggerGameOver();
    }
    updateHealthUI();
  }

  function loop(){ update(); draw(); requestAnimationFrame(loop); }
  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
